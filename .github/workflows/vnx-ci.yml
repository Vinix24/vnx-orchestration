name: VNX CI

on:
  push:
    branches: ["main", "baseline/**"]
  pull_request:

jobs:
  profile-a:
    name: Profile A (doctor + core tests)
    runs-on: ubuntu-latest
    # Bounds a hung job to minutes instead of GitHub's 6-hour hard runner
    # limit. Measured baseline over 6 completed runs (18-08/19-08 2026):
    # 16-21 min end to end; by 2026-10-16 the suite had doubled (run
    # 38911196655 on b39838cf: 35.4 min, pytest 2089 s). 55 min (was 45) for
    # the shadow period of track ci-profile-a-xdist (risk R9): the job ran at
    # 35.4 of its 45 minutes and now also writes a JUnit XML and a collection
    # manifest. The switch to xdist (D4) sets it again from the measured
    # parallel time. Still the vangnet for whatever hangs next, not a fix for
    # the apt-mirror hang fixed in the prelude.
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history (fetch-depth: 0): the profile-a suite includes
        # test_pre_merge_gate.py::TestCheckPRSize, which pins real commit
        # SHAs (9e0813e2..5ab8fe8c) to verify merge-base range counting
        # (OI-838). A depth-1 clone cannot resolve those refs and the test
        # fails with a loud HOLD. Same pattern as the trace-token-check and
        # slug-match-check jobs below.
        with:
          fetch-depth: 0

      # Python with the pinned test tools, the vendored layout, ripgrep, the
      # VNX paths, the profile classifier and the doctor: one composite action
      # shared with the xdist shadow job below, so the shadow never lacks part
      # of this job's setup. Fatal here, as each of those steps was before.
      - name: Profile A prelude
        id: prelude
        uses: ./.github/actions/profile-a-prelude

      - name: Legacy path gate
        run: |
          set -euo pipefail
          matches=$(rg -n '\.vnx-data/state/' "$GITHUB_WORKSPACE/.claude/vnx-system/scripts" \
            --glob "!**/archived*/**" \
            --glob "!**/archive*/**" \
            --glob "!**/*.DEPRECATED" \
            --glob "!**/test_dashboard_sync.py" \
            --glob "!**/intelligence_export.py" \
            --glob "!**/intelligence_import.py" \
            --glob "!**/vnx_install.py" \
            --glob "!**/commands/merge_preflight.sh" \
            --glob "!**/migrate_to_central_vnx.py" \
            --glob "!**/migrate_dry_run.py" \
            || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Legacy path literals detected. Use VNX_STATE_DIR via vnx_paths."
            exit 1
          fi

      - name: Run Profile A (scope-appropriate suite)
        env:
          VNX_HOME: ${{ steps.prelude.outputs.vnx-home }}
          VNX_DATA_DIR: ${{ steps.prelude.outputs.vnx-data-dir }}
          CI_PROFILE: ${{ steps.prelude.outputs.profile }}
          PROFILE_A_EVIDENCE: ${{ runner.temp }}/profile-a-evidence
        run: |
          set -euo pipefail
          if [ "$CI_PROFILE" = "light" ]; then
            # Light profile — docs-only PR (classify_ci_profile.py returned
            # "light"). The doctor already ran in the prelude; add only the doc
            # link/lint checks that actually exercise documentation, then stop.
            # Kept deliberately small and proven rather than a broad "doc-ish"
            # sweep whose coverage nobody can bound:
            #   * test_docs_index.py           — DOCS_INDEX.md links resolve and
            #                                    no stale unreachable docs bloat
            #   * test_docs_archive.py         — docs/_archive integrity and the
            #                                    ARCHIVED_MANIFEST matches disk
            #   * test_subsystems_md_exists.py — docs/core/SUBSYSTEMS.md SSOT
            #   * test_adr_numbers_unique.py   — a docs-only PR can add a new
            #                                    ADR-*.md; this catches a
            #                                    duplicate number on disk (B6)
            # All four are stdlib-only (no DB, no heavy deps) and also run in
            # the full sweep below, so they stay green on main.
            pytest -q \
              "$GITHUB_WORKSPACE/tests/test_docs_index.py" \
              "$GITHUB_WORKSPACE/tests/test_docs_archive.py" \
              "$GITHUB_WORKSPACE/tests/test_subsystems_md_exists.py" \
              "$GITHUB_WORKSPACE/tests/test_adr_numbers_unique.py" \
              -p no:cacheprovider
            exit 0
          fi

          # Full-suite sweep (heavy profile — code, unclassifiable, or empty
          # diff): pytest tests/ at directory level so every test file
          # is exercised, not the handful of explicit files listed before.
          #
          # The sweep targets $GITHUB_WORKSPACE/tests — the real checkout — NOT
          # $VNX_HOME/tests. The vendored .claude/vnx-system/ tree is an install
          # artefact for doctor/path-resolution checks, not the source of truth:
          # it has no .git and only a partial layout, so tests that resolve their
          # repo root from __file__ break there en masse. Measured 2026-08-02 on
          # a faithful local replica of this job (same rsync layout, same venv):
          # the identical sweep failed 222 tests in 43 files against the vendored
          # tree vs 25 against the real checkout — ~197 layout artefacts, not
          # code reds. Mirroring .claude into the vendored copy did not close
          # that gap. The 18 pre-existing explicit-file invocations in this
          # workflow deliberately keep their $VNX_HOME paths (green as-is).
          #
          # The selection — the --ignore list from scripts/ci/test_exclusions.txt
          # (each entry red on main, OI-906, with the OI tracking its repair), the
          # -k quarantine and the per-test timeout — lives in one script that the
          # xdist shadow job calls too. No shared --basetemp: a suite-wide shared
          # basetemp broke tmp_path fixtures (see memory: read-only test dirs
          # poison every later test file). The run also writes a JUnit XML and a
          # collection manifest, uploaded below for the parity check of track
          # ci-profile-a-xdist.
          bash "$GITHUB_WORKSPACE/scripts/ci/profile_a_pytest_args.sh" "$PROFILE_A_EVIDENCE/args"
          bash "$GITHUB_WORKSPACE/scripts/ci/profile_a_run_phase.sh" full "$PROFILE_A_EVIDENCE"

      # Evidence for the parity check (track ci-profile-a-xdist), also when the
      # suite is red. Non-fatal: an artifact-service hiccup must not turn this
      # required job red; missing evidence is the parity check's to record.
      - name: Upload Profile A evidence (JUnit XML + collection manifest)
        if: ${{ always() && steps.prelude.outputs.profile != 'light' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: profile-a-evidence
          path: ${{ runner.temp }}/profile-a-evidence/
          if-no-files-found: warn
          overwrite: true

      - name: Side-door exhaustiveness audit
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          # Audit #2: the dispatch-lane exhaustiveness invariant — fail CI if a new direct delivery
          # caller bypasses the single-entry door without being audited.
          python3 "$VNX_HOME/scripts/lib/dispatch_sidedoor_audit.py"

      - name: Central-mode path gate
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          # Fail CI if a new .vnx-data/ROADMAP.yaml path literal is derived from
          # __file__/parents[N] in scripts/lib (would resolve the keystone, not
          # ~/.vnx-data/<project>, in a central install). See #1023/#1024.
          python3 "$VNX_HOME/scripts/check_no_file_derived_data_paths.py" "$VNX_HOME"

      - name: Out-of-repo symlink guard
        run: |
          set -euo pipefail
          # Fail CI if any symlink (tracked or working-tree) resolves outside
          # the repository root. Detects tests that reference code living in
          # an external install — they'd pass locally but fail on a clean
          # checkout. See dispatch/20260730-ci-out-of-repo-tests-h.
          python3 "$GITHUB_WORKSPACE/scripts/ci/check_out_of_repo_symlinks.py"

      - name: Run out-of-repo symlink guard unit tests
        run: |
          set -euo pipefail
          pytest -q \
            "$GITHUB_WORKSPACE/tests/test_ci_check_out_of_repo_symlinks.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

      - name: Docs file:line reference guard
        run: |
          set -euo pipefail
          # Fail CI when a living docs/ citation (file.py:123) drifts from the
          # tree — the lane-conformity-matrix and its peers must stay honest as
          # code shifts. Scoped to explicit line numbers in living docs only
          # (_archive/examples/investigations/governance-decisions are frozen
          # point-in-time artifacts); code fences are skipped. See OI-1107.
          python3 "$GITHUB_WORKSPACE/scripts/ci/check_docs_file_line_refs.py"

      - name: Run docs file:line reference guard unit tests
        run: |
          set -euo pipefail
          pytest -q \
            "$GITHUB_WORKSPACE/tests/test_ci_check_docs_file_line_refs.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

      - name: Architecture doc drift guard (D6a)
        run: |
          set -euo pipefail
          # Fail CI when docs/core/00_VNX_ARCHITECTURE.md's generated
          # "Supervised Components" / "Hooks" sections drift from the live
          # start_all() registry / .claude/settings.json wiring. See D6
          # (dispatch 20260830-090600) — the doc used to hand-list 15
          # "Active Components" with no relationship to what actually runs.
          python3 "$GITHUB_WORKSPACE/scripts/generate_architecture_doc.py"

      - name: Run architecture doc drift guard unit tests
        run: |
          set -euo pipefail
          pytest -q \
            "$GITHUB_WORKSPACE/tests/test_architecture_doc_drift.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

      - name: Status vocabulary drift guard
        run: |
          set -euo pipefail
          # Fail CI if any module hard-codes its own copy of the completion-
          # outcome status vocabulary (FAILURE_STATUSES | SUCCESS_STATUSES).
          # event_outcome_semantics._STATUS_VOCABULARY is the single source; a
          # second collection drawn entirely from it is a drifting copy. See
          # dispatch/20260816-p9-ledger-vocab-ds.
          python3 "$GITHUB_WORKSPACE/scripts/check_status_vocab_drift.py"

      - name: Run status vocabulary drift guard unit tests
        run: |
          set -euo pipefail
          pytest -q \
            "$GITHUB_WORKSPACE/tests/test_status_vocab_drift.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

  # Track ci-profile-a-xdist (D1): Profile A's suite in the shape the switch to
  # pytest-xdist will run (scripts/ci/serial_tests.txt in one process with
  # xdist off, then the rest under xdist), next to the serial Profile A, so
  # the parity check (D2) can compare the two before anything switches.
  #
  # NOT a required check, and it must never fail one: closure_verifier
  # (_rollup_all_green) requires every CheckRun of the PR to be COMPLETED/
  # SUCCESS, gate_executor.ci_gate blocks on any check in the fail bucket, and
  # the merge preflight reads the conclusion of the whole VNX CI run. Job-level
  # continue-on-error would keep the run green but not this job's CheckRun. So:
  #   * every step that can fail has continue-on-error: true, and later steps
  #     read steps.<id>.outcome into xdist-shadow.json (prelude_failed,
  #     selection_failed, shadow_failed);
  #   * every step has its own timeout-minutes and their sum (73) stays under
  #     the job's timeout-minutes, so a hang ends in a recorded step timeout,
  #     never in a cancelled job;
  #   * the record and the upload run with if: always();
  #   * a light (docs-only) run stops after the prelude and records
  #     "verdict": "not_applicable" — success, never skipped.
  profile-a-xdist-shadow:
    name: Profile A (xdist shadow)
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Checkout
        id: checkout
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Profile A prelude (non-fatal)
        id: prelude
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./.github/actions/profile-a-prelude

      - name: Plan the shadow phases
        id: plan
        if: ${{ !cancelled() && steps.prelude.outcome == 'success' && steps.prelude.outputs.profile == 'heavy' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          VNX_HOME: ${{ steps.prelude.outputs.vnx-home }}
          VNX_DATA_DIR: ${{ steps.prelude.outputs.vnx-data-dir }}
          VNX_CI_XDIST: "1"
          SHADOW_EVIDENCE: ${{ runner.temp }}/profile-a-xdist-shadow
        run: |
          set -euo pipefail
          mkdir -p "$SHADOW_EVIDENCE"
          bash "$GITHUB_WORKSPACE/scripts/ci/profile_a_pytest_args.sh" "$SHADOW_EVIDENCE/args"
          if [ -f "$SHADOW_EVIDENCE/args/serial.args" ]; then
            echo "serial_active=true" >> "$GITHUB_OUTPUT"
          else
            # Empty serial list: the phase is inactive and needs no XML.
            echo "serial_active=false" >> "$GITHUB_OUTPUT"
            python3 "$GITHUB_WORKSPACE/scripts/ci/pytest_collection_manifest.py" inactive \
              --phase serial --output "$SHADOW_EVIDENCE/manifest-serial.json"
          fi

      - name: Shadow phase 1 (serial list, xdist off)
        id: serial
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.plan.outputs.serial_active == 'true' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          VNX_HOME: ${{ steps.prelude.outputs.vnx-home }}
          VNX_DATA_DIR: ${{ steps.prelude.outputs.vnx-data-dir }}
          SHADOW_EVIDENCE: ${{ runner.temp }}/profile-a-xdist-shadow
        run: bash "$GITHUB_WORKSPACE/scripts/ci/profile_a_run_phase.sh" serial "$SHADOW_EVIDENCE"

      # Runs whatever the serial phase did: both phases are evidence.
      - name: Shadow phase 2 (the rest, under pytest-xdist)
        id: parallel
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 30
        env:
          VNX_HOME: ${{ steps.prelude.outputs.vnx-home }}
          VNX_DATA_DIR: ${{ steps.prelude.outputs.vnx-data-dir }}
          SHADOW_EVIDENCE: ${{ runner.temp }}/profile-a-xdist-shadow
        run: bash "$GITHUB_WORKSPACE/scripts/ci/profile_a_run_phase.sh" parallel "$SHADOW_EVIDENCE"

      # Plain bash, no checkout needed: it must also record a run whose
      # checkout or prelude failed. Every input arrives through env.
      - name: Record the shadow outcome
        id: record
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          SHADOW_EVIDENCE: ${{ runner.temp }}/profile-a-xdist-shadow
          SHADOW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SHADOW_TESTED_SHA: ${{ github.sha }}
          SHADOW_RUN_ID: ${{ github.run_id }}
          SHADOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          SHADOW_EVENT: ${{ github.event_name }}
          SHADOW_PROFILE: ${{ steps.prelude.outputs.profile }}
          SHADOW_SERIAL_ACTIVE: ${{ steps.plan.outputs.serial_active }}
          OUTCOME_CHECKOUT: ${{ steps.checkout.outcome }}
          OUTCOME_PRELUDE: ${{ steps.prelude.outcome }}
          OUTCOME_PLAN: ${{ steps.plan.outcome }}
          OUTCOME_SERIAL: ${{ steps.serial.outcome }}
          OUTCOME_PARALLEL: ${{ steps.parallel.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$SHADOW_EVIDENCE"
          token() { printf '"%s"' "$(printf '%s' "$1" | tr -cd 'A-Za-z0-9_.:/-')"; }
          int_file() {
            local v=""
            if [ -f "$1" ]; then v="$(tr -cd '0-9' < "$1")"; fi
            if [ -n "$v" ]; then printf '%s' "$v"; else printf 'null'; fi
          }
          if [ "$OUTCOME_CHECKOUT" != "success" ] || [ "$OUTCOME_PRELUDE" != "success" ]; then
            verdict="prelude_failed"
          elif [ "$SHADOW_PROFILE" = "light" ]; then
            verdict="not_applicable"
          elif [ "$SHADOW_PROFILE" != "heavy" ]; then
            verdict="prelude_failed"
          elif [ "$OUTCOME_PLAN" != "success" ]; then
            verdict="selection_failed"
          elif [ "$OUTCOME_PARALLEL" != "success" ]; then
            verdict="shadow_failed"
          elif [ "$SHADOW_SERIAL_ACTIVE" = "true" ] && [ "$OUTCOME_SERIAL" != "success" ]; then
            verdict="shadow_failed"
          else
            verdict="shadow_passed"
          fi
          E="$SHADOW_EVIDENCE"
          {
            printf '{\n'
            printf '  "schema": "vnx-xdist-shadow/1",\n'
            printf '  "head_sha": %s,\n' "$(token "$SHADOW_HEAD_SHA")"
            printf '  "tested_sha": %s,\n' "$(token "$SHADOW_TESTED_SHA")"
            printf '  "run_id": %s,\n' "$(token "$SHADOW_RUN_ID")"
            printf '  "run_attempt": %s,\n' "$(token "$SHADOW_RUN_ATTEMPT")"
            printf '  "event": %s,\n' "$(token "$SHADOW_EVENT")"
            printf '  "profile": %s,\n' "$(token "$SHADOW_PROFILE")"
            printf '  "verdict": "%s",\n' "$verdict"
            printf '  "serial_phase_active": %s,\n' "$(token "$SHADOW_SERIAL_ACTIVE")"
            printf '  "steps": {"checkout": %s, "prelude": %s, "plan": %s, "serial": %s, "parallel": %s},\n' \
              "$(token "$OUTCOME_CHECKOUT")" "$(token "$OUTCOME_PRELUDE")" "$(token "$OUTCOME_PLAN")" \
              "$(token "$OUTCOME_SERIAL")" "$(token "$OUTCOME_PARALLEL")"
            printf '  "exit_codes": {"serial": %s, "parallel": %s},\n' \
              "$(int_file "$E/exit-serial")" "$(int_file "$E/exit-parallel")"
            printf '  "durations_s": {"serial": %s, "parallel": %s},\n' \
              "$(int_file "$E/duration-serial-s")" "$(int_file "$E/duration-parallel-s")"
            printf '  "memory_kb": {"total": %s, "baseline_used_parallel": %s, "peak_used_serial": %s, "peak_used_parallel": %s}\n' \
              "$(int_file "$E/mem-total-kb")" "$(int_file "$E/mem-baseline-used-kb-parallel")" \
              "$(int_file "$E/mem-peak-used-kb-serial")" "$(int_file "$E/mem-peak-used-kb-parallel")"
            printf '}\n'
          } > "$E/xdist-shadow.json"
          cat "$E/xdist-shadow.json"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              printf '### Profile A (xdist shadow)\n\n'
              printf 'Not a required check. Verdict: **%s** (profile %s).\n\n' "$verdict" "${SHADOW_PROFILE:-unknown}"
              printf '| step | outcome | exit | seconds | peak used kB |\n|---|---|---|---|---|\n'
              printf '| checkout | %s | | | |\n' "${OUTCOME_CHECKOUT:-}"
              printf '| prelude | %s | | | |\n' "${OUTCOME_PRELUDE:-}"
              printf '| plan | %s | | | |\n' "${OUTCOME_PLAN:-}"
              printf '| serial | %s | %s | %s | %s |\n' "${OUTCOME_SERIAL:-}" "$(int_file "$E/exit-serial")" \
                "$(int_file "$E/duration-serial-s")" "$(int_file "$E/mem-peak-used-kb-serial")"
              printf '| parallel | %s | %s | %s | %s |\n' "${OUTCOME_PARALLEL:-}" "$(int_file "$E/exit-parallel")" \
                "$(int_file "$E/duration-parallel-s")" "$(int_file "$E/mem-peak-used-kb-parallel")"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload shadow evidence
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: profile-a-xdist-shadow-evidence
          path: ${{ runner.temp }}/profile-a-xdist-shadow/
          if-no-files-found: warn
          overwrite: true

  trace-token-check:
    name: Trace Token Validation
    runs-on: ubuntu-latest
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's
    # 6-hour hard limit (measured baseline 16-21 min, 45 min ceiling).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare expected repo layout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.claude"
          rsync -a --exclude '.git' --exclude '.claude' ./ "$GITHUB_WORKSPACE/.claude/vnx-system/"

      - name: Run trace token validation
        # ENFORCED since 2026-09-03 (was shadow/WARN — a required context that could
        # never fail). Safe to flip without a separate ratchet mechanism: the script
        # only validates MERGE_BASE..HEAD (this PR's own new commits, via
        # ci_trace_token_check.sh's `git log "$MERGE_BASE..HEAD"`), never main's
        # existing history — a push event to main resolves MERGE_BASE==HEAD (empty
        # range), so already-merged commits are structurally never re-litigated.
        # Baseline measured against origin/main @ 065939fa: 41/150 (27.3%) of recent
        # commits and 860/2130 (40.4%) of all commits would fail if re-checked, which
        # is exactly why this only gates NEW commits going forward, not history.
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
          VNX_PROVENANCE_ENFORCEMENT: "1"
          VNX_PROVENANCE_LEGACY_ACCEPTED: "1"
        run: |
          set -euo pipefail
          bash "$VNX_HOME/scripts/ci_trace_token_check.sh" "${{ github.event.pull_request.base.ref || 'main' }}"

      - name: Run trace token validator tests
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          python3 "$VNX_HOME/tests/test_trace_token_validator.py"

  slug-match-check:
    name: Dispatch-ID Slug-Match Gate
    runs-on: ubuntu-latest
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's
    # 6-hour hard limit (measured baseline 16-21 min, 45 min ceiling).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Prepare expected repo layout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.claude"
          rsync -a --exclude '.git' --exclude '.claude' ./ "$GITHUB_WORKSPACE/.claude/vnx-system/"

      - name: Run Dispatch-ID slug-match gate
        # STAYS shadow/WARN (deliberately, not an oversight) — measured 2026-09-03:
        # this job's own branch_slug() cannot pass for this fleet's actual branch
        # convention. BRANCH_PREFIX_RE (scripts/check_ci_slug_match.py) strips
        # fix/feat/feature/test/docs/chore/refactor/hotfix/perf/ci/build/revert but
        # NOT "dispatch/" — the prefix on 15/15 of the most recent merged PRs' head
        # branches (`gh pr list --state merged --json headRefName`). Even with that
        # fixed, branch_slug() doesn't strip the embedded YYYYMMDD date the way
        # dispatch_id_slug() does for the Dispatch-ID side, so the two slugs still
        # wouldn't compare like-for-like. And some real, currently-used Dispatch-IDs
        # (the YYYYMMDD-HHMMSS-<slug> shape with no trailing track letter, e.g.
        # PR #1740's branch) don't match either DISPATCH_ID_EXTRACT_RE or
        # DISPATCH_ID_EXTRACT_LEGACY_RE at all — dispatch_id_slug() returns None,
        # and CommitResult.all_slugs_match treats that as a hard failure, not a
        # skip. Enforcing today would fail effectively every fleet PR, not just the
        # ~27-40% trace-token-check would flag — the "ratchet" fix that worked for
        # that job (flip the env var; the merge-base delta already grandfathers
        # history) does not apply here, because this job's failures would be on
        # brand-new commits too, not just old ones. Fixing branch_slug()/
        # dispatch_id_slug() properly is a separate, larger PR; recommendation for
        # this one is to drop this context from branch-protection's required-checks
        # list (operator action — not done here) so its WARN-only status stops
        # reading as a check that could ever fail.
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
          VNX_SLUG_ENFORCEMENT: "0"
        run: |
          set -euo pipefail
          python3 "$VNX_HOME/scripts/check_ci_slug_match.py" \
            --base-ref "${GITHUB_BASE_REF:-main}" \
            --branch-name "${GITHUB_HEAD_REF:-}"

      - name: Run slug-match gate unit tests
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          pytest -q \
            "$VNX_HOME/tests/test_ci_slug_match_gate.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

  profile-c:
