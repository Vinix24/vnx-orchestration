name: VNX CI

on:
  push:
    branches: ["main", "baseline/**"]
  pull_request:

jobs:
  profile-a:
    name: Profile A (doctor + core tests)
    # Pinned to the 24.04 image deliberately (2026-10-30): the moving
    # `latest` runner label was bumped to the 26.04 image, which turned main
    # red on run 41079080194 — four profile-a suites died inside `install-central`
    # with `BASH_SOURCE[0]: unbound variable`, and setup-python has no 3.9
    # build for 26.04 ("The version '3.9' with architecture 'x64' was not
    # found for Ubuntu 26.04"). Every job in both CI workflows carries this
    # pin. OI "Main-CI rood door runner-image" holds the way back to the
    # moving label.
    runs-on: ubuntu-24.04
    # Bounds a hung job to minutes instead of GitHub's 6-hour hard runner
    # limit. Measured baseline over 6 completed runs (18-08/19-08 2026):
    # 16-21 min end to end; by 2026-10-16 the suite had doubled (run
    # 38911196655 on b39838cf: 35.4 min, pytest 2089 s). D4 switched Profile A
    # to the two-phase xdist shape and set this from the merge window it lands
    # on: `xdist_parity_history.py --last-d3-merge 983c944f` reads 23 in-window
    # runs, all exit 0, and the longest shadow suite wall time is 1134 s (run
    # 41827919472 on 65b7aa65, 2026-11-04), so 2 x 1134 s = 2268 s = 37.8 min,
    # rounded up to whole minutes: 38. Still the vangnet for whatever hangs
    # next, not a fix for the apt-mirror hang fixed in the prelude.
    # VNX_CI_XDIST=0 is the way back to the serial sweep; on main that shape
    # takes 52 to 54.8 minutes (OI-2523), so that branch gets 80 (OI-2525) --
    # the bridge D3c (#2378) set on 2026-11-03, kept as the rollback's bound
    # now that D4 sizes the xdist branch from the measured window.
    timeout-minutes: ${{ vars.VNX_CI_XDIST == '0' && 80 || 38 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history (fetch-depth: 0): the profile-a suite includes
        # test_pre_merge_gate.py::TestCheckPRSize, which pins real commit
        # SHAs (9e0813e2..5ab8fe8c) to verify merge-base range counting
        # (OI-838). A depth-1 clone cannot resolve those refs and the test
        # fails with a loud HOLD. Same pattern as the trace-token-check and
        # slug-match-check jobs below.
        with:
          fetch-depth: 0

      # Python with the pinned test tools, the vendored layout, ripgrep, the
      # VNX paths, the profile classifier and the doctor: one composite action
      # shared with the nightly serial truth, so the two never run against a
      # different tool set. Fatal here, as each of those steps was before.
      - name: Profile A prelude
        id: prelude
        uses: ./.github/actions/profile-a-prelude

      - name: Legacy path gate
        run: |
          set -euo pipefail
          matches=$(rg -n '\.vnx-data/state/' "$GITHUB_WORKSPACE/.claude/vnx-system/scripts" \
            --glob "!**/archived*/**" \
            --glob "!**/archive*/**" \
            --glob "!**/*.DEPRECATED" \
            --glob "!**/test_dashboard_sync.py" \
            --glob "!**/intelligence_export.py" \
            --glob "!**/intelligence_import.py" \
            --glob "!**/vnx_install.py" \
            --glob "!**/commands/merge_preflight.sh" \
            --glob "!**/migrate_to_central_vnx.py" \
            --glob "!**/migrate_dry_run.py" \
            || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Legacy path literals detected. Use VNX_STATE_DIR via vnx_paths."
            exit 1
          fi

      - name: Run Profile A (scope-appropriate suite)
        id: suite
        env:
          VNX_HOME: ${{ steps.prelude.outputs.vnx-home }}
          VNX_DATA_DIR: ${{ steps.prelude.outputs.vnx-data-dir }}
          CI_PROFILE: ${{ steps.prelude.outputs.profile }}
          # D4: the way back to fully serial is the repository variable
          # VNX_CI_XDIST=0. Unset (the normal state) is the two-phase xdist
          # shape; nothing else changes.
          VNX_CI_XDIST: ${{ vars.VNX_CI_XDIST }}
          PROFILE_A_EVIDENCE: ${{ runner.temp }}/profile-a-evidence
        run: |
          set -euo pipefail
          if [ "$CI_PROFILE" = "light" ]; then
            # Light profile — docs-only PR (classify_ci_profile.py returned
            # "light"). The doctor already ran in the prelude; add only the doc
            # link/lint checks that actually exercise documentation, then stop.
            # Kept deliberately small and proven rather than a broad "doc-ish"
            # sweep whose coverage nobody can bound:
            #   * test_docs_index.py           — DOCS_INDEX.md links resolve and
            #                                    no stale unreachable docs bloat
            #   * test_docs_archive.py         — docs/_archive integrity and the
            #                                    ARCHIVED_MANIFEST matches disk
            #   * test_subsystems_md_exists.py — docs/core/SUBSYSTEMS.md SSOT
            #   * test_adr_numbers_unique.py   — a docs-only PR can add a new
            #                                    ADR-*.md; this catches a
            #                                    duplicate number on disk (B6)
            # All four are stdlib-only (no DB, no heavy deps) and also run in
            # the full sweep, so they stay green on main.
            pytest -q \
              "$GITHUB_WORKSPACE/tests/test_docs_index.py" \
              "$GITHUB_WORKSPACE/tests/test_docs_archive.py" \
              "$GITHUB_WORKSPACE/tests/test_subsystems_md_exists.py" \
              "$GITHUB_WORKSPACE/tests/test_adr_numbers_unique.py" \
              -p no:cacheprovider
            exit 0
          fi

          # Heavy profile. The selection — the --ignore list from
          # scripts/ci/test_exclusions.txt (each entry red on main, OI-906, with
          # the OI tracking its repair), the -k quarantine and the per-test
          # timeout — lives in one script the nightly serial truth calls too.
          # No shared --basetemp: a suite-wide shared basetemp broke tmp_path
          # fixtures (see memory: read-only test dirs poison every later test
          # file). The sweep targets $GITHUB_WORKSPACE/tests — the real
          # checkout — NOT $VNX_HOME/tests: the vendored tree is an install
          # artefact with no .git, so tests that resolve their repo root from
          # __file__ break there en masse (measured 2026-08-02: 222 failed vs 25
          # on the real checkout).
          bash "$GITHUB_WORKSPACE/scripts/ci/profile_a_pytest_args.sh" "$PROFILE_A_EVIDENCE/args"
          if [ -f "$PROFILE_A_EVIDENCE/args/full.args" ]; then
            # VNX_CI_XDIST=0: the serial whole-tree sweep, one phase. It writes
            # the same JUnit XML and collection manifest as before.
            echo "mode=serial" >> "$GITHUB_OUTPUT"
            echo "serial_active=false" >> "$GITHUB_OUTPUT"
            bash "$GITHUB_WORKSPACE/scripts/ci/profile_a_run_phase.sh" full "$PROFILE_A_EVIDENCE"
            exit 0
          fi
          echo "mode=xdist" >> "$GITHUB_OUTPUT"
          if [ -f "$PROFILE_A_EVIDENCE/args/serial.args" ]; then
            echo "serial_active=true" >> "$GITHUB_OUTPUT"
          else
            # Empty serial list: the phase is inactive and needs no XML.
            echo "serial_active=false" >> "$GITHUB_OUTPUT"
            python3 "$GITHUB_WORKSPACE/scripts/ci/pytest_collection_manifest.py" inactive \
              --phase serial --output "$PROFILE_A_EVIDENCE/manifest-serial.json"
          fi

      - name: Profile A serial phase (serial list, xdist off)
        id: serial
        if: ${{ !cancelled() && steps.suite.outputs.mode == 'xdist' && steps.suite.outputs.serial_active == 'true' }}
        env:
          VNX_HOME: ${{ steps.prelude.outputs.vnx-home }}
          VNX_DATA_DIR: ${{ steps.prelude.outputs.vnx-data-dir }}
          PROFILE_A_EVIDENCE: ${{ runner.temp }}/profile-a-evidence
        run: bash "$GITHUB_WORKSPACE/scripts/ci/profile_a_run_phase.sh" serial "$PROFILE_A_EVIDENCE"

      - name: Profile A parallel phase (the rest, under pytest-xdist)
        id: parallel
        if: ${{ !cancelled() && steps.suite.outputs.mode == 'xdist' }}
        env:
          VNX_HOME: ${{ steps.prelude.outputs.vnx-home }}
          VNX_DATA_DIR: ${{ steps.prelude.outputs.vnx-data-dir }}
          PROFILE_A_EVIDENCE: ${{ runner.temp }}/profile-a-evidence
        run: bash "$GITHUB_WORKSPACE/scripts/ci/profile_a_run_phase.sh" parallel "$PROFILE_A_EVIDENCE"

      # The required check of the two-phase shape: nothing may be dropped. It
      # reads this run's own manifests and XMLs plus the recorded skip set, and
      # it fails the job (no continue-on-error) on a collected test that did
      # not run, a test run twice, a broken partition, a failed collection or a
      # skip that is not in scripts/ci/xdist_expected_skips.txt.
      - name: Check the xdist completeness (required)
        id: completeness
        if: ${{ !cancelled() && steps.suite.outputs.mode == 'xdist' && steps.parallel.outcome == 'success' && (steps.suite.outputs.serial_active != 'true' || steps.serial.outcome == 'success') }}
        env:
          VNX_HOME: ${{ steps.prelude.outputs.vnx-home }}
          VNX_DATA_DIR: ${{ steps.prelude.outputs.vnx-data-dir }}
          PROFILE_A_EVIDENCE: ${{ runner.temp }}/profile-a-evidence
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/ci/check_xdist_parity.py" completeness \
            --candidate "$PROFILE_A_EVIDENCE" \
            --constraints "$GITHUB_WORKSPACE/scripts/ci/profile_a_constraints.txt" \
            --expected-skips "$GITHUB_WORKSPACE/scripts/ci/xdist_expected_skips.txt" \
            --output "$PROFILE_A_EVIDENCE/xdist-completeness-verdict.json" \
            --summary "${GITHUB_STEP_SUMMARY:-/dev/null}" \
            --head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --tested-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF_NAME"

      # OI-1420: state how much of the tree the sweep skips, non-fatally.
      - name: Test exclusions coverage summary
        if: ${{ always() }}
        continue-on-error: true
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/check_test_exclusions.py" "$GITHUB_WORKSPACE" --summary | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # Evidence, also when the suite is red. Non-fatal: an artifact-service
      # hiccup must not turn this required job red.
      - name: Upload Profile A evidence (JUnit XML + manifest + completeness verdict)
        if: ${{ always() && steps.prelude.outputs.profile != 'light' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: profile-a-evidence
          path: ${{ runner.temp }}/profile-a-evidence/
          if-no-files-found: warn
          overwrite: true

      - name: Side-door exhaustiveness audit
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          # Audit #2: the dispatch-lane exhaustiveness invariant — fail CI if a new direct delivery
          # caller bypasses the single-entry door without being audited.
          python3 "$VNX_HOME/scripts/lib/dispatch_sidedoor_audit.py"

      - name: Central-mode path gate
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          # Fail CI if a new .vnx-data/ROADMAP.yaml path literal is derived from
          # __file__/parents[N] in scripts/lib (would resolve the keystone, not
          # ~/.vnx-data/<project>, in a central install). See #1023/#1024.
          python3 "$VNX_HOME/scripts/check_no_file_derived_data_paths.py" "$VNX_HOME"

      - name: Out-of-repo symlink guard
        run: |
          set -euo pipefail
          # Fail CI if any symlink (tracked or working-tree) resolves outside
          # the repository root. Detects tests that reference code living in
          # an external install — they'd pass locally but fail on a clean
          # checkout. See dispatch/20260730-ci-out-of-repo-tests-h.
          python3 "$GITHUB_WORKSPACE/scripts/ci/check_out_of_repo_symlinks.py"

      - name: Run out-of-repo symlink guard unit tests
        run: |
          set -euo pipefail
          pytest -q \
            "$GITHUB_WORKSPACE/tests/test_ci_check_out_of_repo_symlinks.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

      - name: Docs file:line reference guard
        run: |
          set -euo pipefail
          # Fail CI when a living docs/ citation (file.py:123) drifts from the
          # tree — the lane-conformity-matrix and its peers must stay honest as
          # code shifts. Scoped to explicit line numbers in living docs only
          # (_archive/examples/investigations/governance-decisions are frozen
          # point-in-time artifacts); code fences are skipped. See OI-1107.
          python3 "$GITHUB_WORKSPACE/scripts/ci/check_docs_file_line_refs.py"

      - name: Run docs file:line reference guard unit tests
        run: |
          set -euo pipefail
          pytest -q \
            "$GITHUB_WORKSPACE/tests/test_ci_check_docs_file_line_refs.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

      - name: Retired paths guard
        run: |
          set -euo pipefail
          # Fail CI when a path, symbol or env var that golf 1 removed comes
          # back, or when anything still calls it in an executable way (import,
          # -m, a command in shell/yaml/json/plist, an env read). Comments,
          # docstrings, markdown and frozen history do not count. The list is
          # scripts/ci/retired_paths.d/: one fragment per cluster, so parallel
          # clusters never conflict on it.
          python3 "$GITHUB_WORKSPACE/scripts/ci/check_retired_paths.py" \
            --root "$GITHUB_WORKSPACE" \
            --list-dir "$GITHUB_WORKSPACE/scripts/ci/retired_paths.d"

      - name: Run retired paths guard unit tests
        run: |
          set -euo pipefail
          pytest -q \
            "$GITHUB_WORKSPACE/tests/test_ci_check_retired_paths.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

      - name: Architecture doc drift guard (D6a)
        run: |
          set -euo pipefail
          # Fail CI when docs/core/00_VNX_ARCHITECTURE.md's generated
          # "Supervised Components" / "Hooks" sections drift from the live
          # start_all() registry / .claude/settings.json wiring. See D6
          # (dispatch 20260830-090600) — the doc used to hand-list 15
          # "Active Components" with no relationship to what actually runs.
          python3 "$GITHUB_WORKSPACE/scripts/generate_architecture_doc.py"

      - name: Run architecture doc drift guard unit tests
        run: |
          set -euo pipefail
          pytest -q \
            "$GITHUB_WORKSPACE/tests/test_architecture_doc_drift.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

      - name: Status vocabulary drift guard
        run: |
          set -euo pipefail
          # Fail CI if any module hard-codes its own copy of the completion-
          # outcome status vocabulary (FAILURE_STATUSES | SUCCESS_STATUSES).
          # event_outcome_semantics._STATUS_VOCABULARY is the single source; a
          # second collection drawn entirely from it is a drifting copy. See
          # dispatch/20260816-p9-ledger-vocab-ds.
          python3 "$GITHUB_WORKSPACE/scripts/check_status_vocab_drift.py"

      - name: Run status vocabulary drift guard unit tests
        run: |
          set -euo pipefail
          pytest -q \
            "$GITHUB_WORKSPACE/tests/test_status_vocab_drift.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe
  trace-token-check:
    name: Trace Token Validation
    runs-on: ubuntu-24.04
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's
    # 6-hour hard limit (measured baseline 16-21 min, 45 min ceiling).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare expected repo layout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.claude"
          rsync -a --exclude '.git' --exclude '.claude' ./ "$GITHUB_WORKSPACE/.claude/vnx-system/"

      - name: Run trace token validation
        # ENFORCED since 2026-09-03 (was shadow/WARN — a required context that could
        # never fail). Safe to flip without a separate ratchet mechanism: the script
        # only validates MERGE_BASE..HEAD (this PR's own new commits, via
        # ci_trace_token_check.sh's `git log "$MERGE_BASE..HEAD"`), never main's
        # existing history — a push event to main resolves MERGE_BASE==HEAD (empty
        # range), so already-merged commits are structurally never re-litigated.
        # Baseline measured against origin/main @ 065939fa: 41/150 (27.3%) of recent
        # commits and 860/2130 (40.4%) of all commits would fail if re-checked, which
        # is exactly why this only gates NEW commits going forward, not history.
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
          VNX_PROVENANCE_ENFORCEMENT: "1"
          VNX_PROVENANCE_LEGACY_ACCEPTED: "1"
        run: |
          set -euo pipefail
          bash "$VNX_HOME/scripts/ci_trace_token_check.sh" "${{ github.event.pull_request.base.ref || 'main' }}"

      - name: Run trace token validator tests
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          python3 "$VNX_HOME/tests/test_trace_token_validator.py"

  slug-match-check:
    name: Dispatch-ID Slug-Match Gate
    runs-on: ubuntu-24.04
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's
    # 6-hour hard limit (measured baseline 16-21 min, 45 min ceiling).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Prepare expected repo layout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.claude"
          rsync -a --exclude '.git' --exclude '.claude' ./ "$GITHUB_WORKSPACE/.claude/vnx-system/"

      - name: Run Dispatch-ID slug-match gate
        # STAYS shadow/WARN (deliberately, not an oversight) — measured 2026-09-03:
        # this job's own branch_slug() cannot pass for this fleet's actual branch
        # convention. BRANCH_PREFIX_RE (scripts/check_ci_slug_match.py) strips
        # fix/feat/feature/test/docs/chore/refactor/hotfix/perf/ci/build/revert but
        # NOT "dispatch/" — the prefix on 15/15 of the most recent merged PRs' head
        # branches (`gh pr list --state merged --json headRefName`). Even with that
        # fixed, branch_slug() doesn't strip the embedded YYYYMMDD date the way
        # dispatch_id_slug() does for the Dispatch-ID side, so the two slugs still
        # wouldn't compare like-for-like. And some real, currently-used Dispatch-IDs
        # (the YYYYMMDD-HHMMSS-<slug> shape with no trailing track letter, e.g.
        # PR #1740's branch) don't match either DISPATCH_ID_EXTRACT_RE or
        # DISPATCH_ID_EXTRACT_LEGACY_RE at all — dispatch_id_slug() returns None,
        # and CommitResult.all_slugs_match treats that as a hard failure, not a
        # skip. Enforcing today would fail effectively every fleet PR, not just the
        # ~27-40% trace-token-check would flag — the "ratchet" fix that worked for
        # that job (flip the env var; the merge-base delta already grandfathers
        # history) does not apply here, because this job's failures would be on
        # brand-new commits too, not just old ones. Fixing branch_slug()/
        # dispatch_id_slug() properly is a separate, larger PR; recommendation for
        # this one is to drop this context from branch-protection's required-checks
        # list (operator action — not done here) so its WARN-only status stops
        # reading as a check that could ever fail.
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
          VNX_SLUG_ENFORCEMENT: "0"
        run: |
          set -euo pipefail
          python3 "$VNX_HOME/scripts/check_ci_slug_match.py" \
            --base-ref "${GITHUB_BASE_REF:-main}" \
            --branch-name "${GITHUB_HEAD_REF:-}"

      - name: Run slug-match gate unit tests
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          pytest -q \
            "$VNX_HOME/tests/test_ci_slug_match_gate.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

  profile-c:
    name: Profile C (adoption smoke tests)
    runs-on: ubuntu-24.04
    needs: profile-a
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's
    # 6-hour hard limit (measured baseline 16-21 min, 45 min ceiling).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Prepare expected repo layout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.claude"
          rsync -a --exclude '.git' --exclude '.claude' ./ "$GITHUB_WORKSPACE/.claude/vnx-system/"
          rsync -a ./skills/ "$GITHUB_WORKSPACE/.claude/skills/"

      - name: Run path-resolution regression tests
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          pytest -q \
            "$VNX_HOME/tests/test_path_resolution_regression.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

      - name: Run docs-command validation tests
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          pytest -q \
            "$VNX_HOME/tests/test_docs_command_validation.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

      - name: Run quickstart validation tests
        run: |
          set -euo pipefail
          pytest -q \
            "$GITHUB_WORKSPACE/.claude/vnx-system/tests/test_quickstart_validation.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

  profile-b:
    name: Profile B (snapshot integration)
    runs-on: ubuntu-24.04
    needs: profile-a
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's
    # 6-hour hard limit (measured baseline 16-21 min, 45 min ceiling).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Prepare expected repo layout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.claude"
          rsync -a --exclude '.git' --exclude '.claude' ./ "$GITHUB_WORKSPACE/.claude/vnx-system/"
          rsync -a ./skills/ "$GITHUB_WORKSPACE/.claude/skills/"

      - name: Install ripgrep
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep already present on the runner image, skipping download"
            exit 0
          fi
          # Pinned release + sha256-verified static binary instead of apt-get
          # (OI-1362): ripgrep ships on NO ubuntu runner image, so this skip-tak
          # never fires, and apt-get against azure.archive.ubuntu.com stalls
          # intermittently and hangs the job even with the timeout+retry from
          # #1608 — measured 2026-08-18/19: run 32294142912 (PR #1609) and run
          # 32291338049 (main) both died in this exact step with exit 124, on
          # different jobs each time. x86_64-unknown-linux-musl is statically
          # linked — no glibc dependency, so it runs unchanged across any
          # runner base-image drift.
          RG_VERSION="15.2.0"
          RG_SHA256="33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c"
          RG_ARCHIVE="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_ARCHIVE}"
          RG_DIR="${RUNNER_TEMP:-/tmp}/ripgrep-install"
          mkdir -p "$RG_DIR/bin"
          curl -sSL --retry 3 --fail -o "$RG_DIR/$RG_ARCHIVE" "$RG_URL"
          echo "${RG_SHA256}  ${RG_DIR}/${RG_ARCHIVE}" | sha256sum -c -
          tar -xzf "$RG_DIR/$RG_ARCHIVE" -C "$RG_DIR"
          install -m 755 "$RG_DIR/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" "$RG_DIR/bin/rg"
          echo "$RG_DIR/bin" >> "$GITHUB_PATH"

      - name: Legacy path gate
        run: |
          set -euo pipefail
          matches=$(rg -n '\.vnx-data/state/' "$GITHUB_WORKSPACE/.claude/vnx-system/scripts" \
            --glob "!**/archived*/**" \
            --glob "!**/archive*/**" \
            --glob "!**/*.DEPRECATED" \
            --glob "!**/test_dashboard_sync.py" \
            --glob "!**/intelligence_export.py" \
            --glob "!**/intelligence_import.py" \
            --glob "!**/vnx_install.py" \
            --glob "!**/commands/merge_preflight.sh" \
            --glob "!**/migrate_to_central_vnx.py" \
            --glob "!**/migrate_dry_run.py" \
            || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Legacy path literals detected. Use VNX_STATE_DIR via vnx_paths."
            exit 1
          fi

      - name: Run Profile B
        run: |
          set -euo pipefail
          START_DIR="$GITHUB_WORKSPACE"
          SNAPSHOT_ROOT="$(mktemp -d /tmp/vnx-safe-tests.XXXXXX)"
          SNAPSHOT_REPO="$SNAPSHOT_ROOT/repo"
          trap 'rm -rf "$SNAPSHOT_ROOT"' EXIT

          mkdir -p "$SNAPSHOT_REPO/.claude/vnx-system"
          rsync -a --exclude '__pycache__' "$START_DIR/.claude/vnx-system/scripts/" "$SNAPSHOT_REPO/.claude/vnx-system/scripts/"
          rsync -a --exclude '__pycache__' "$START_DIR/.claude/vnx-system/tests/" "$SNAPSHOT_REPO/.claude/vnx-system/tests/"
          if [ -d "$START_DIR/.claude/vnx-system/dispatches" ]; then
            rsync -a --exclude '__pycache__' "$START_DIR/.claude/vnx-system/dispatches/" "$SNAPSHOT_REPO/.claude/vnx-system/dispatches/"
          else
            mkdir -p "$SNAPSHOT_REPO/.claude/vnx-system/dispatches"
          fi
          mkdir -p "$SNAPSHOT_REPO/.claude/vnx-system/state" "$SNAPSHOT_REPO/.claude/vnx-system/templates"
          printf '# Feature: Snapshot\n' > "$SNAPSHOT_REPO/FEATURE_PLAN.md"

          cd "$SNAPSHOT_REPO"
          export VNX_HOME="$SNAPSHOT_REPO/.claude/vnx-system"
          export VNX_DATA_DIR="$SNAPSHOT_REPO/.claude/vnx-system"
          python3 .claude/vnx-system/tests/test_pr_recommendation_integration.py

  dashboard-lint:
    name: Dashboard TS Lint (fixture-gate + typecheck)
    runs-on: ubuntu-24.04
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's
    # 6-hour hard limit (measured baseline 16-21 min, 45 min ceiling).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/token-dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard/token-dashboard
        run: npm ci

      - name: Run dashboard lint (fixture gate + typecheck)
        working-directory: dashboard/token-dashboard
        run: npm run test:lint

  lint-patterns:
    name: Lint Patterns (silent-except + atomic-write)
    runs-on: ubuntu-24.04
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's
    # 6-hour hard limit (measured baseline 16-21 min, 45 min ceiling).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare expected repo layout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.claude"
          rsync -a --exclude '.git' --exclude '.claude' ./ "$GITHUB_WORKSPACE/.claude/vnx-system/"

      - name: Run lint gate
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          # Outer workspace owns git; the rsynced VNX_HOME has no .git.
          # We compute the diff here (real checkout) and pipe added-line
          # text to the scanner, which is a pure content checker.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="origin/${{ github.base_ref }}"
            diff_range="${base_ref}...HEAD"
          else
            diff_range="HEAD^...HEAD"
          fi
          mapfile -t changed < <(git diff --name-only "${diff_range}" \
            | grep -E '^(scripts|dashboard)/.*\.py$' || true)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "[skip] No Python files changed in scripts/ or dashboard/"
            exit 0
          fi
          added=$(git diff --unified=0 "${diff_range}" -- "${changed[@]}" \
            | grep -E '^\+[^+]' | sed 's/^+//' || true)
          if [ -z "$added" ]; then
            echo "[skip] No added lines in target files"
            exit 0
          fi
          printf '%s\n' "$added" | python3 "$VNX_HOME/scripts/ci_lint_patterns.py" --scan-stdin

      # Own step, not part of the lint step: that step exits early (exit 0)
      # when no line was added, which must not skip this check.
      - name: Function size ratchet
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          # Needs git, so it runs from the outer checkout, not the rsynced copy.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="origin/${{ github.base_ref }}"
          else
            base_ref="HEAD^"
          fi
          python3 "$VNX_HOME/scripts/ci/check_function_size_ratchet.py" --base "${base_ref}" --head HEAD

      # Own step, so the early exit of the lint step never skips it. Pull
      # requests only: it needs the merge base and the PR number, which a push
      # to main or baseline/** does not have, and a skipped step leaves the
      # job success. The rules: scripts/ci/check_changelog_fragments.py.
      - name: Changelog fragments
        if: github.event_name == 'pull_request'
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Needs git, so it runs from the outer checkout, not the rsynced copy.
          merge_base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          python3 "$VNX_HOME/scripts/ci/check_changelog_fragments.py" \
            --base "${merge_base}" --head HEAD --pr "${PR_NUMBER}"

  profile-d:
    name: Profile D (pip install smoke)
    runs-on: ubuntu-24.04
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's
    # 6-hour hard limit (measured baseline 16-21 min, 45 min ceiling).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build

      - name: Run pip install smoke
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/ci/pip_install_smoke.sh"

  context-rotation-plugin:
    name: Context-rotation plugin tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's 6-hour hard limit.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run package tests
        # Own pytest.ini (testpaths = tests). No tests collected is pytest
        # exit code 5, which fails the step: it is deliberately not masked.
        working-directory: packages/claude-code-toolkit/context-rotation
        run: python -m pytest -q

  state-pin-gate:
    name: Repo-local state-pin gate (#1043 footgun)
    runs-on: ubuntu-24.04
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's
    # 6-hour hard limit (measured baseline 16-21 min, 45 min ceiling).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep already present on the runner image, skipping download"
            exit 0
          fi
          # Pinned release + sha256-verified static binary instead of apt-get
          # (OI-1362): ripgrep ships on NO ubuntu runner image, so this skip-tak
          # never fires, and apt-get against azure.archive.ubuntu.com stalls
          # intermittently and hangs the job even with the timeout+retry from
          # #1608 — measured 2026-08-18/19: run 32294142912 (PR #1609) and run
          # 32291338049 (main) both died in this exact step with exit 124, on
          # different jobs each time. x86_64-unknown-linux-musl is statically
          # linked — no glibc dependency, so it runs unchanged across any
          # runner base-image drift.
          RG_VERSION="15.2.0"
          RG_SHA256="33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c"
          RG_ARCHIVE="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_ARCHIVE}"
          RG_DIR="${RUNNER_TEMP:-/tmp}/ripgrep-install"
          mkdir -p "$RG_DIR/bin"
          curl -sSL --retry 3 --fail -o "$RG_DIR/$RG_ARCHIVE" "$RG_URL"
          echo "${RG_SHA256}  ${RG_DIR}/${RG_ARCHIVE}" | sha256sum -c -
          tar -xzf "$RG_DIR/$RG_ARCHIVE" -C "$RG_DIR"
          install -m 755 "$RG_DIR/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" "$RG_DIR/bin/rg"
          echo "$RG_DIR/bin" >> "$GITHUB_PATH"

      - name: Ban repo-local VNX_STATE_DIR pins
        run: |
          set -euo pipefail
          # #1043 footgun: pinning VNX_STATE_DIR to a repo-local .vnx-data path breaks
          # central-mode resolution and forks the audit trail. The pre-existing "Legacy
          # path gate" only scans scripts/; the footgun actually lived in the T0 role,
          # templates, skills and docs. Ban the relative pin across every RUNTIME surface
          # (scripts, hooks, templates, skills, .claude role/skill md, bin, vnx_cli).
          # tests/ legitimately point VNX_STATE_DIR at tmp dirs; prose docs that only
          # DESCRIBE the footgun (CHANGELOG, README, docs/, claudedocs/, daily-log/) have no
          # runtime effect and are excluded so documenting the pattern does not fail the gate.
          # rg exits 0 (matches), 1 (no matches), 2+ (error). Distinguish them: a bare `|| true`
          # would mask an rg error (bad regex, unreadable tree) as a clean pass.
          set +e
          matches=$(rg -n "VNX_STATE_DIR[[:space:]]*=[[:space:]]*[\"']?\.{0,2}/?\.vnx-data" . \
            --glob "!**/tests/**" \
            --glob "!**/daily-log/**" \
            --glob "!**/archive*/**" \
            --glob "!**/.git/**" \
            --glob "!**/.vnx-data/**" \
            --glob "!**/*.DEPRECATED" \
            --glob "!docs/**" \
            --glob "!claudedocs/**" \
            --glob "!CHANGELOG.md" \
            --glob "!README.md")
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "ripgrep errored (exit $rc) — failing the gate instead of masking it as a pass"
            exit "$rc"
          fi
          if [ -n "$matches" ]; then
            echo "$matches"
            echo ""
            echo "Repo-local VNX_STATE_DIR pin detected (#1043 footgun)."
            echo "Resolve state via VNX_DATA_DIR / vnx_paths — never pin a repo-local .vnx-data path."
            exit 1
          fi
          echo "[ok] no repo-local VNX_STATE_DIR pins in shipped surfaces"
