  profile-b:
    name: Profile B (snapshot integration)
    runs-on: ubuntu-latest
    needs: profile-a
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's
    # 6-hour hard limit (measured baseline 16-21 min, 45 min ceiling).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Prepare expected repo layout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.claude"
          rsync -a --exclude '.git' --exclude '.claude' ./ "$GITHUB_WORKSPACE/.claude/vnx-system/"
          rsync -a ./skills/ "$GITHUB_WORKSPACE/.claude/skills/"

      - name: Install ripgrep
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep already present on the runner image, skipping download"
            exit 0
          fi
          # Pinned release + sha256-verified static binary instead of apt-get
          # (OI-1362): ripgrep ships on NO ubuntu-latest image, so this skip-tak
          # never fires, and apt-get against azure.archive.ubuntu.com stalls
          # intermittently and hangs the job even with the timeout+retry from
          # #1608 — measured 2026-08-18/19: run 32294142912 (PR #1609) and run
          # 32291338049 (main) both died in this exact step with exit 124, on
          # different jobs each time. x86_64-unknown-linux-musl is statically
          # linked — no glibc dependency, so it runs unchanged across any
          # ubuntu-latest base-image drift.
          RG_VERSION="15.2.0"
          RG_SHA256="33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c"
          RG_ARCHIVE="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_ARCHIVE}"
          RG_DIR="${RUNNER_TEMP:-/tmp}/ripgrep-install"
          mkdir -p "$RG_DIR/bin"
          curl -sSL --retry 3 --fail -o "$RG_DIR/$RG_ARCHIVE" "$RG_URL"
          echo "${RG_SHA256}  ${RG_DIR}/${RG_ARCHIVE}" | sha256sum -c -
          tar -xzf "$RG_DIR/$RG_ARCHIVE" -C "$RG_DIR"
          install -m 755 "$RG_DIR/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" "$RG_DIR/bin/rg"
          echo "$RG_DIR/bin" >> "$GITHUB_PATH"

      - name: Legacy path gate
        run: |
          set -euo pipefail
          matches=$(rg -n '\.vnx-data/state/' "$GITHUB_WORKSPACE/.claude/vnx-system/scripts" \
            --glob "!**/archived*/**" \
            --glob "!**/archive*/**" \
            --glob "!**/*.DEPRECATED" \
            --glob "!**/test_dashboard_sync.py" \
            --glob "!**/intelligence_export.py" \
            --glob "!**/intelligence_import.py" \
            --glob "!**/vnx_install.py" \
            --glob "!**/commands/merge_preflight.sh" \
            --glob "!**/migrate_to_central_vnx.py" \
            --glob "!**/migrate_dry_run.py" \
            || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Legacy path literals detected. Use VNX_STATE_DIR via vnx_paths."
            exit 1
          fi

      - name: Run Profile B
        run: |
          set -euo pipefail
          START_DIR="$GITHUB_WORKSPACE"
          SNAPSHOT_ROOT="$(mktemp -d /tmp/vnx-safe-tests.XXXXXX)"
          SNAPSHOT_REPO="$SNAPSHOT_ROOT/repo"
          trap 'rm -rf "$SNAPSHOT_ROOT"' EXIT

          mkdir -p "$SNAPSHOT_REPO/.claude/vnx-system"
          rsync -a --exclude '__pycache__' "$START_DIR/.claude/vnx-system/scripts/" "$SNAPSHOT_REPO/.claude/vnx-system/scripts/"
          rsync -a --exclude '__pycache__' "$START_DIR/.claude/vnx-system/tests/" "$SNAPSHOT_REPO/.claude/vnx-system/tests/"
          if [ -d "$START_DIR/.claude/vnx-system/dispatches" ]; then
            rsync -a --exclude '__pycache__' "$START_DIR/.claude/vnx-system/dispatches/" "$SNAPSHOT_REPO/.claude/vnx-system/dispatches/"
          else
            mkdir -p "$SNAPSHOT_REPO/.claude/vnx-system/dispatches"
          fi
          mkdir -p "$SNAPSHOT_REPO/.claude/vnx-system/state" "$SNAPSHOT_REPO/.claude/vnx-system/templates"
          printf '# Feature: Snapshot\n' > "$SNAPSHOT_REPO/FEATURE_PLAN.md"

          cd "$SNAPSHOT_REPO"
          export VNX_HOME="$SNAPSHOT_REPO/.claude/vnx-system"
          export VNX_DATA_DIR="$SNAPSHOT_REPO/.claude/vnx-system"
          python3 .claude/vnx-system/tests/test_pr_recommendation_integration.py

  dashboard-lint:
    name: Dashboard TS Lint (fixture-gate + typecheck)
    runs-on: ubuntu-latest
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's
    # 6-hour hard limit (measured baseline 16-21 min, 45 min ceiling).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/token-dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard/token-dashboard
        run: npm ci

      - name: Run dashboard lint (fixture gate + typecheck)
        working-directory: dashboard/token-dashboard
        run: npm run test:lint

  lint-patterns:
    name: Lint Patterns (silent-except + atomic-write)
    runs-on: ubuntu-latest
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's
    # 6-hour hard limit (measured baseline 16-21 min, 45 min ceiling).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare expected repo layout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.claude"
          rsync -a --exclude '.git' --exclude '.claude' ./ "$GITHUB_WORKSPACE/.claude/vnx-system/"

      - name: Run lint gate
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          # Outer workspace owns git; the rsynced VNX_HOME has no .git.
          # We compute the diff here (real checkout) and pipe added-line
          # text to the scanner, which is a pure content checker.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="origin/${{ github.base_ref }}"
            diff_range="${base_ref}...HEAD"
          else
            diff_range="HEAD^...HEAD"
          fi
          mapfile -t changed < <(git diff --name-only "${diff_range}" \
            | grep -E '^(scripts|dashboard)/.*\.py$' || true)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "[skip] No Python files changed in scripts/ or dashboard/"
            exit 0
          fi
          added=$(git diff --unified=0 "${diff_range}" -- "${changed[@]}" \
            | grep -E '^\+[^+]' | sed 's/^+//' || true)
          if [ -z "$added" ]; then
            echo "[skip] No added lines in target files"
            exit 0
          fi
          printf '%s\n' "$added" | python3 "$VNX_HOME/scripts/ci_lint_patterns.py" --scan-stdin

      # Own step, not part of the lint step: that step exits early (exit 0)
      # when no line was added, which must not skip this check.
      - name: Function size ratchet
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          # Needs git, so it runs from the outer checkout, not the rsynced copy.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="origin/${{ github.base_ref }}"
          else
            base_ref="HEAD^"
          fi
          python3 "$VNX_HOME/scripts/ci/check_function_size_ratchet.py" --base "${base_ref}" --head HEAD

  profile-d:
    name: Profile D (pip install smoke)
    runs-on: ubuntu-latest
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's
