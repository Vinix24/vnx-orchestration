  context-rotation-plugin:
    name: Context-rotation plugin tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's 6-hour hard limit.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run package tests
        # Own pytest.ini (testpaths = tests). No tests collected is pytest
        # exit code 5, which fails the step: it is deliberately not masked.
        working-directory: packages/claude-code-toolkit/context-rotation
        run: python -m pytest -q

  state-pin-gate:
    name: Repo-local state-pin gate (#1043 footgun)
    runs-on: ubuntu-latest
    # See "Profile A" above: bounds a hung job to minutes, not GitHub's
    # 6-hour hard limit (measured baseline 16-21 min, 45 min ceiling).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep already present on the runner image, skipping download"
            exit 0
          fi
          # Pinned release + sha256-verified static binary instead of apt-get
          # (OI-1362): ripgrep ships on NO ubuntu-latest image, so this skip-tak
          # never fires, and apt-get against azure.archive.ubuntu.com stalls
          # intermittently and hangs the job even with the timeout+retry from
          # #1608 — measured 2026-08-18/19: run 32294142912 (PR #1609) and run
          # 32291338049 (main) both died in this exact step with exit 124, on
          # different jobs each time. x86_64-unknown-linux-musl is statically
          # linked — no glibc dependency, so it runs unchanged across any
          # ubuntu-latest base-image drift.
          RG_VERSION="15.2.0"
          RG_SHA256="33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c"
          RG_ARCHIVE="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_ARCHIVE}"
          RG_DIR="${RUNNER_TEMP:-/tmp}/ripgrep-install"
          mkdir -p "$RG_DIR/bin"
          curl -sSL --retry 3 --fail -o "$RG_DIR/$RG_ARCHIVE" "$RG_URL"
          echo "${RG_SHA256}  ${RG_DIR}/${RG_ARCHIVE}" | sha256sum -c -
          tar -xzf "$RG_DIR/$RG_ARCHIVE" -C "$RG_DIR"
          install -m 755 "$RG_DIR/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" "$RG_DIR/bin/rg"
          echo "$RG_DIR/bin" >> "$GITHUB_PATH"

      - name: Ban repo-local VNX_STATE_DIR pins
        run: |
          set -euo pipefail
          # #1043 footgun: pinning VNX_STATE_DIR to a repo-local .vnx-data path breaks
          # central-mode resolution and forks the audit trail. The pre-existing "Legacy
          # path gate" only scans scripts/; the footgun actually lived in the T0 role,
          # templates, skills and docs. Ban the relative pin across every RUNTIME surface
          # (scripts, hooks, templates, skills, .claude role/skill md, bin, vnx_cli).
          # tests/ legitimately point VNX_STATE_DIR at tmp dirs; prose docs that only
          # DESCRIBE the footgun (CHANGELOG, README, docs/, claudedocs/, daily-log/) have no
          # runtime effect and are excluded so documenting the pattern does not fail the gate.
          # rg exits 0 (matches), 1 (no matches), 2+ (error). Distinguish them: a bare `|| true`
          # would mask an rg error (bad regex, unreadable tree) as a clean pass.
          set +e
          matches=$(rg -n "VNX_STATE_DIR[[:space:]]*=[[:space:]]*[\"']?\.{0,2}/?\.vnx-data" . \
            --glob "!**/tests/**" \
            --glob "!**/daily-log/**" \
            --glob "!**/archive*/**" \
            --glob "!**/.git/**" \
            --glob "!**/.vnx-data/**" \
            --glob "!**/*.DEPRECATED" \
            --glob "!docs/**" \
            --glob "!claudedocs/**" \
            --glob "!CHANGELOG.md" \
            --glob "!README.md")
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "ripgrep errored (exit $rc) — failing the gate instead of masking it as a pass"
            exit "$rc"
          fi
          if [ -n "$matches" ]; then
            echo "$matches"
            echo ""
            echo "Repo-local VNX_STATE_DIR pin detected (#1043 footgun)."
            echo "Resolve state via VNX_DATA_DIR / vnx_paths — never pin a repo-local .vnx-data path."
            exit 1
          fi
          echo "[ok] no repo-local VNX_STATE_DIR pins in shipped surfaces"
