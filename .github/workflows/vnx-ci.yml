name: VNX CI

on:
  push:
    branches: ["main", "baseline/**"]
  pull_request:

jobs:
  profile-a:
    name: Profile A (doctor + core tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # pytest + pytest-timeout (hanging-test guard) plus the project's
          # declared runtime deps (watchdog, jinja2, pyyaml, jsonschema, psutil
          # — all in pyproject.toml [project.dependencies]) and one test-only
          # dep (hypothesis). Without these, tests that import governed-report
          # validation, the intelligence daemon monitor, headless_trigger, or
          # `vnx init` (jinja2) fail to collect with ModuleNotFoundError even
          # though they pass on main.
          # networkx is deliberately NOT installed: without numpy/scipy alongside,
          # repo_map.py leaves its positional fallback for the networkx path and
          # nx.pagerank crashes on the missing numpy — measured 2026-08-02:
          # test_repo_map_provider_coverage.py (green on main) fails 2 tests with
          # networkx present, passes 11/11 without it.
          pip install pytest pyyaml pytest-timeout jsonschema psutil watchdog hypothesis jinja2

      - name: Prepare expected repo layout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.claude"
          rsync -a --exclude '.git' --exclude '.claude' ./ "$GITHUB_WORKSPACE/.claude/vnx-system/"
          # Mirror the repo's .claude content into the VNX_HOME copy. Code that
          # resolves the project root to $VNX_HOME expects .claude/settings.json,
          # .claude/terminals, and .claude/skills exactly like the local checkout
          # (e.g. lane_adapter.SKILLS_ROOT, role-sync guards, session-start hooks).
          # Exclude vnx-system to avoid recursive self-copy.
          rsync -a --exclude 'vnx-system' ./.claude/ "$GITHUB_WORKSPACE/.claude/vnx-system/.claude/"
          rsync -a ./skills/ "$GITHUB_WORKSPACE/.claude/skills/"

      - name: Install ripgrep
        run: |
          # Strip the flaky packages.microsoft.com (azure-cli) apt source that intermittently
          # breaks apt-get update on ubuntu-latest with a NOSPLIT/hash-sum mismatch.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/*microsoft*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Legacy path gate
        run: |
          set -euo pipefail
          matches=$(rg -n '\.vnx-data/state/' "$GITHUB_WORKSPACE/.claude/vnx-system/scripts" \
            --glob "!**/archived*/**" \
            --glob "!**/archive*/**" \
            --glob "!**/*.DEPRECATED" \
            --glob "!**/test_dashboard_sync.py" \
            --glob "!**/intelligence_export.py" \
            --glob "!**/intelligence_import.py" \
            --glob "!**/vnx_install.py" \
            --glob "!**/commands/merge_preflight.sh" \
            --glob "!**/migrate_to_central_vnx.py" \
            --glob "!**/migrate_dry_run.py" \
            || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Legacy path literals detected. Use VNX_STATE_DIR via vnx_paths."
            exit 1
          fi

      - name: Run Profile A (doctor + full test suite)
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
          VNX_DATA_DIR: ${{ github.workspace }}/.vnx-data
        run: |
          set -euo pipefail
          bash "$VNX_HOME/scripts/vnx_doctor.sh"
          if [ -f "$VNX_DATA_DIR/state/progress_state.yaml" ] && [ -f "$VNX_DATA_DIR/state/progress_state.yaml.sha256" ]; then
            python3 "$VNX_HOME/scripts/state_integrity.py" verify "$VNX_DATA_DIR/state/progress_state.yaml"
          else
            echo "[skip] progress_state checksum not available"
          fi
          # Full-suite sweep: pytest tests/ at directory level so every test file
          # is exercised, not the handful of explicit files listed before. The
          # explicit exclusion list lives in scripts/ci/test_exclusions.txt —
          # each entry is red on main (OI-906) and cites the open item tracking
          # its repair; nothing is excluded silently. No shared --basetemp: a
          # suite-wide shared basetemp broke tmp_path fixtures (see memory:
          # read-only test dirs poison every later test file).
          IGNORE=()
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            rel="$(printf '%s' "$line" | sed -E 's/[[:space:]]*#.*//' | tr -d '[:space:]')"
            [ -n "$rel" ] && IGNORE+=(--ignore="$VNX_HOME/$rel")
          done < "$VNX_HOME/scripts/ci/test_exclusions.txt"
          pytest -q \
            "$VNX_HOME/tests" \
            -p no:cacheprovider \
            --timeout=180 \
            -k "not TestFlagGateClaude" \
            "${IGNORE[@]}"

      - name: Side-door exhaustiveness audit
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          # Audit #2: the dispatch-lane exhaustiveness invariant — fail CI if a new direct delivery
          # caller bypasses the single-entry door without being audited.
          python3 "$VNX_HOME/scripts/lib/dispatch_sidedoor_audit.py"

      - name: Central-mode path gate
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          # Fail CI if a new .vnx-data/ROADMAP.yaml path literal is derived from
          # __file__/parents[N] in scripts/lib (would resolve the keystone, not
          # ~/.vnx-data/<project>, in a central install). See #1023/#1024.
          python3 "$VNX_HOME/scripts/check_no_file_derived_data_paths.py" "$VNX_HOME"

      - name: Out-of-repo symlink guard
        run: |
          set -euo pipefail
          # Fail CI if any symlink (tracked or working-tree) resolves outside
          # the repository root. Detects tests that reference code living in
          # an external install — they'd pass locally but fail on a clean
          # checkout. See dispatch/20260730-ci-out-of-repo-tests-h.
          python3 "$GITHUB_WORKSPACE/scripts/ci/check_out_of_repo_symlinks.py"

      - name: Run out-of-repo symlink guard unit tests
        run: |
          set -euo pipefail
          pytest -q \
            "$GITHUB_WORKSPACE/tests/test_ci_check_out_of_repo_symlinks.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

  trace-token-check:
    name: Trace Token Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare expected repo layout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.claude"
          rsync -a --exclude '.git' --exclude '.claude' ./ "$GITHUB_WORKSPACE/.claude/vnx-system/"

      - name: Run trace token validation
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
          VNX_PROVENANCE_ENFORCEMENT: "0"
          VNX_PROVENANCE_LEGACY_ACCEPTED: "1"
        run: |
          set -euo pipefail
          bash "$VNX_HOME/scripts/ci_trace_token_check.sh" "${{ github.event.pull_request.base.ref || 'main' }}"

      - name: Run trace token validator tests
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          python3 "$VNX_HOME/tests/test_trace_token_validator.py"

  slug-match-check:
    name: Dispatch-ID Slug-Match Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Prepare expected repo layout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.claude"
          rsync -a --exclude '.git' --exclude '.claude' ./ "$GITHUB_WORKSPACE/.claude/vnx-system/"

      - name: Run Dispatch-ID slug-match gate
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
          VNX_SLUG_ENFORCEMENT: "0"
        run: |
          set -euo pipefail
          python3 "$VNX_HOME/scripts/check_ci_slug_match.py" \
            --base-ref "${GITHUB_BASE_REF:-main}" \
            --branch-name "${GITHUB_HEAD_REF:-}"

      - name: Run slug-match gate unit tests
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          pytest -q \
            "$VNX_HOME/tests/test_ci_slug_match_gate.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

  profile-c:
    name: Profile C (adoption smoke tests)
    runs-on: ubuntu-latest
    needs: profile-a

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Prepare expected repo layout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.claude"
          rsync -a --exclude '.git' --exclude '.claude' ./ "$GITHUB_WORKSPACE/.claude/vnx-system/"
          rsync -a ./skills/ "$GITHUB_WORKSPACE/.claude/skills/"

      - name: Run path-resolution regression tests
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          pytest -q \
            "$VNX_HOME/tests/test_path_resolution_regression.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

      - name: Run docs-command validation tests
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          pytest -q \
            "$VNX_HOME/tests/test_docs_command_validation.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

      - name: Run quickstart validation tests
        run: |
          set -euo pipefail
          pytest -q \
            "$GITHUB_WORKSPACE/.claude/vnx-system/tests/test_quickstart_validation.py" \
            -p no:cacheprovider \
            --basetemp=/tmp/vnx_pytest_safe

      - name: Run closure verification
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          python3 "$VNX_HOME/scripts/verify_closure.py"

  profile-b:
    name: Profile B (snapshot integration)
    runs-on: ubuntu-latest
    needs: profile-a

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Prepare expected repo layout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.claude"
          rsync -a --exclude '.git' --exclude '.claude' ./ "$GITHUB_WORKSPACE/.claude/vnx-system/"
          rsync -a ./skills/ "$GITHUB_WORKSPACE/.claude/skills/"

      - name: Install ripgrep
        run: |
          # Strip the flaky packages.microsoft.com (azure-cli) apt source that intermittently
          # breaks apt-get update on ubuntu-latest with a NOSPLIT/hash-sum mismatch.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/*microsoft*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Legacy path gate
        run: |
          set -euo pipefail
          matches=$(rg -n '\.vnx-data/state/' "$GITHUB_WORKSPACE/.claude/vnx-system/scripts" \
            --glob "!**/archived*/**" \
            --glob "!**/archive*/**" \
            --glob "!**/*.DEPRECATED" \
            --glob "!**/test_dashboard_sync.py" \
            --glob "!**/intelligence_export.py" \
            --glob "!**/intelligence_import.py" \
            --glob "!**/vnx_install.py" \
            --glob "!**/commands/merge_preflight.sh" \
            --glob "!**/migrate_to_central_vnx.py" \
            --glob "!**/migrate_dry_run.py" \
            || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Legacy path literals detected. Use VNX_STATE_DIR via vnx_paths."
            exit 1
          fi

      - name: Run Profile B
        run: |
          set -euo pipefail
          START_DIR="$GITHUB_WORKSPACE"
          SNAPSHOT_ROOT="$(mktemp -d /tmp/vnx-safe-tests.XXXXXX)"
          SNAPSHOT_REPO="$SNAPSHOT_ROOT/repo"
          trap 'rm -rf "$SNAPSHOT_ROOT"' EXIT

          mkdir -p "$SNAPSHOT_REPO/.claude/vnx-system"
          rsync -a --exclude '__pycache__' "$START_DIR/.claude/vnx-system/scripts/" "$SNAPSHOT_REPO/.claude/vnx-system/scripts/"
          rsync -a --exclude '__pycache__' "$START_DIR/.claude/vnx-system/tests/" "$SNAPSHOT_REPO/.claude/vnx-system/tests/"
          if [ -d "$START_DIR/.claude/vnx-system/dispatches" ]; then
            rsync -a --exclude '__pycache__' "$START_DIR/.claude/vnx-system/dispatches/" "$SNAPSHOT_REPO/.claude/vnx-system/dispatches/"
          else
            mkdir -p "$SNAPSHOT_REPO/.claude/vnx-system/dispatches"
          fi
          mkdir -p "$SNAPSHOT_REPO/.claude/vnx-system/state" "$SNAPSHOT_REPO/.claude/vnx-system/templates"
          printf '# Feature: Snapshot\n' > "$SNAPSHOT_REPO/FEATURE_PLAN.md"

          cd "$SNAPSHOT_REPO"
          export VNX_HOME="$SNAPSHOT_REPO/.claude/vnx-system"
          export VNX_DATA_DIR="$SNAPSHOT_REPO/.claude/vnx-system"
          python3 .claude/vnx-system/tests/test_pr_recommendation_integration.py

  dashboard-lint:
    name: Dashboard TS Lint (fixture-gate + typecheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/token-dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard/token-dashboard
        run: npm ci

      - name: Run dashboard lint (fixture gate + typecheck)
        working-directory: dashboard/token-dashboard
        run: npm run test:lint

  lint-patterns:
    name: Lint Patterns (silent-except + atomic-write)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare expected repo layout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.claude"
          rsync -a --exclude '.git' --exclude '.claude' ./ "$GITHUB_WORKSPACE/.claude/vnx-system/"

      - name: Run lint gate
        env:
          VNX_HOME: ${{ github.workspace }}/.claude/vnx-system
        run: |
          set -euo pipefail
          # Outer workspace owns git; the rsynced VNX_HOME has no .git.
          # We compute the diff here (real checkout) and pipe added-line
          # text to the scanner, which is a pure content checker.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="origin/${{ github.base_ref }}"
            diff_range="${base_ref}...HEAD"
          else
            diff_range="HEAD^...HEAD"
          fi
          changed=$(git diff --name-only "${diff_range}" \
            | grep -E '^(scripts|dashboard)/.*\.py$' || true)
          if [ -z "$changed" ]; then
            echo "[skip] No Python files changed in scripts/ or dashboard/"
            exit 0
          fi
          added=$(git diff --unified=0 "${diff_range}" -- $changed \
            | grep -E '^\+[^+]' | sed 's/^+//' || true)
          if [ -z "$added" ]; then
            echo "[skip] No added lines in target files"
            exit 0
          fi
          printf '%s\n' "$added" | python3 "$VNX_HOME/scripts/ci_lint_patterns.py" --scan-stdin

  profile-d:
    name: Profile D (pip install smoke)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build

      - name: Run pip install smoke
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/ci/pip_install_smoke.sh"

  state-pin-gate:
    name: Repo-local state-pin gate (#1043 footgun)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          # Strip the flaky packages.microsoft.com (azure-cli) apt source that intermittently
          # breaks apt-get update on ubuntu-latest with a NOSPLIT/hash-sum mismatch.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/*microsoft*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Ban repo-local VNX_STATE_DIR pins
        run: |
          set -euo pipefail
          # #1043 footgun: pinning VNX_STATE_DIR to a repo-local .vnx-data path breaks
          # central-mode resolution and forks the audit trail. The pre-existing "Legacy
          # path gate" only scans scripts/; the footgun actually lived in the T0 role,
          # templates, skills and docs. Ban the relative pin across every RUNTIME surface
          # (scripts, hooks, templates, skills, .claude role/skill md, bin, vnx_cli).
          # tests/ legitimately point VNX_STATE_DIR at tmp dirs; prose docs that only
          # DESCRIBE the footgun (CHANGELOG, README, docs/, claudedocs/, daily-log/) have no
          # runtime effect and are excluded so documenting the pattern does not fail the gate.
          # rg exits 0 (matches), 1 (no matches), 2+ (error). Distinguish them: a bare `|| true`
          # would mask an rg error (bad regex, unreadable tree) as a clean pass.
          set +e
          matches=$(rg -n "VNX_STATE_DIR[[:space:]]*=[[:space:]]*[\"']?\.{0,2}/?\.vnx-data" . \
            --glob "!**/tests/**" \
            --glob "!**/daily-log/**" \
            --glob "!**/archive*/**" \
            --glob "!**/.git/**" \
            --glob "!**/.vnx-data/**" \
            --glob "!**/*.DEPRECATED" \
            --glob "!docs/**" \
            --glob "!claudedocs/**" \
            --glob "!CHANGELOG.md" \
            --glob "!README.md")
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "ripgrep errored (exit $rc) — failing the gate instead of masking it as a pass"
            exit "$rc"
          fi
          if [ -n "$matches" ]; then
            echo "$matches"
            echo ""
            echo "Repo-local VNX_STATE_DIR pin detected (#1043 footgun)."
            echo "Resolve state via VNX_DATA_DIR / vnx_paths — never pin a repo-local .vnx-data path."
            exit 1
          fi
          echo "[ok] no repo-local VNX_STATE_DIR pins in shipped surfaces"
