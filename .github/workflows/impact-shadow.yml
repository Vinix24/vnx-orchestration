name: Impact shadow

# ADR-074 besluit 3, 7c and 15: the saving of the impact selection is a wall
# clock, measured here by running only S on the same candidate as Profile A.
# It decides nothing: continue-on-error on the job and on the steps, scripts
# that exit 0, no `needs` and no entry in any required check list.
# It lives in its own workflow so the conclusion of VNX CI, which the merge door
# waits for, no longer includes it (measured 24-11: it was the longest job in 2 of
# the last 3 green PR runs). No concurrency group: a cancelled run would leave its
# VNX CI run without a pair, and `vnx impact collect` pairs the two by head sha.
# The shadow STEP in Profile A (vnx-ci.yml) stays on every event.
on:
  pull_request:

jobs:
  impact-shadow:
    name: Impact shadow (runs only S, never required)
    runs-on: ubuntu-24.04
    continue-on-error: true
    # The Profile A bound: the job runs a subset, so it never needs more.
    timeout-minutes: 38
    permissions: {contents: read, actions: read}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Profile A prelude
        id: prelude
        uses: ./.github/actions/profile-a-prelude

      - name: Run only S and record the wall clock (never fails the job)
        if: ${{ steps.prelude.outputs.profile != 'light' }}
        continue-on-error: true
        env:
          VNX_HOME: ${{ steps.prelude.outputs.vnx-home }}
          VNX_DATA_DIR: ${{ steps.prelude.outputs.vnx-data-dir }}
          VNX_CI_XDIST: ${{ vars.VNX_CI_XDIST }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/impact_shadow_job.sh" "$RUNNER_TEMP/impact-shadow-job"

      - name: Upload the impact shadow job record
        if: ${{ always() && steps.prelude.outputs.profile != 'light' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: impact-shadow-job
          path: ${{ runner.temp }}/impact-shadow-job/
          if-no-files-found: warn
          overwrite: true
