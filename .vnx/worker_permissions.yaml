version: 1

# VNX worker permission profiles.
# Project-specific overrides survive rc-cutover via 'vnx regen-worker-permissions --merge'.
# VNX-managed keys are listed in _vnx_meta.managed_keys below.
#
# Role names are the CANONICAL names from the agents/ registry (agents/<role>/) and
# the role-selection table in .claude/terminals/T0/role-orchestrator.md. A profile
# exists for every role T0 actually dispatches (backend-developer, code-reviewer,
# frontend-developer, quality-engineer, research-analyst, security-engineer,
# system-architect). plan-reviewer is NOT T0-dispatched: it is the plan-gate
# panel's seat role (scripts/lib/plan_gate_panel.py passes --role plan-reviewer
# to its claude/tmux seats) and is registered here because resolve_worker_profile
# refuses fail-closed (OI-1069 pt.5, #1563) on a role absent from every register.
# Legacy names (test-engineer, architect) are NOT carried here:
# they were old labels for quality-engineer / system-architect and nobody dispatches
# them. database-engineer / intelligence-engineer are not dispatched either and were
# dropped for the same reason.
#
# deny-vs-duty rule (OI-1100): a role dispatched with the standard footer MUST be
# able to commit, push, and open a PR — so its profile permits git add/commit/push
# and Write/Edit. A role that must NOT mutate code (code-reviewer, research-analyst)
# denies those ops AND is not dispatched with the push-mandatory footer. Each profile
# below states which side of that line it is on.

_vnx_meta:
  managed_keys:
    - version
    - "profiles.<role>.allowed_tools (vnx_baseline)"
    - "profiles.<role>.denied_tools (vnx_baseline)"
    - "profiles.<role>.bash_allow_patterns (vnx_baseline)"
    - "profiles.<role>.bash_deny_patterns (vnx_baseline)"
    - "profiles.<role>.mcp_servers (vnx_baseline)"
    - "terminal_assignments (vnx_baseline; project overrides win)"
  project_owned_keys:
    - "profiles.<role>.file_write_scope"
    - "profiles.<project-role>  (roles not present in the template)"
  description: >
    VNX worker permission profiles. Merge via 'vnx regen-worker-permissions --merge'.
    file_write_scope entries and project-added roles survive cutover unchanged.

profiles:
  backend-developer:
    # Build role — default_instruction: "commit and push a dispatch branch".
    # May mutate code and git history.
    allowed_tools:
      - Read
      - Write
      - Edit
      - MultiEdit
      - Bash
      - Grep
      - Glob
      - "Bash(git:*)"
      - "Bash(gh:*)"
      - "Bash(python3:*)"
      - "Bash(pytest:*)"
      - "Bash(pip:*)"
      - "Bash(rm:*)"
      - "Bash(chmod:*)"
      - "Bash(mkdir:*)"
    denied_tools: [WebSearch, WebFetch]
    bash_allow_patterns:
      - "pytest*"
      - "python3*"
      - "git*"
      - "gh*"
      - "pip install*"
      - "bash -n*"
      - "chmod*"
    bash_deny_patterns:
      - "rm -rf*"
      - "git reset --hard*"
      - "git push --force*"
      - "git push -f*"
      - "curl*anthropic*"
    file_write_scope:
      - "scripts/**"
      - "tests/**"
      - "dashboard/**"
      # --- role-scope-parity (20260815-opsch-w2-rolescope-fix): rol-te-smal own-work.
      # Each added rule below is backend-developer's OWN runtime work (per the
      # ownership map in scripts/analysis/role_scope_outside_triage.py), evidenced
      # by the 48 rol-te-smal dispatches that wrote these paths outside the old
      # scope. Counts = outside path-occurrences in that bucket. No blanket
      # docs/**: docs/core|governance/decisions|manifesto stay system-architect's.
      - "vnx_cli/**"            # 51 — CLI package (runtime implementation)
      - "bin/**"                # 5  — runtime entrypoints (bin/vnx)
      - "hooks/**"              # 1  — runtime hooks (monitor_tripwire.sh)
      - "configs/**"            # 3  — runtime config (plan_gate_panel/producer_freshness)
      - "docs/applications/**"  # 3  — feature docs
      - "docs/operations/**"    # 4  — ops docs (overlaps security's WORKER_PERMISSIONS.md)
      - "docs/MIGRATION_GUIDE.md"  # 1  — root feature doc (literal: a docs/*.md glob would span / into docs/core, docs/governance/decisions, docs/manifesto)
      - "VERSION"               # 5  — root build/release file
      - "CHANGELOG.md"          # 4  — root build/release file
      - "pyproject.toml"        # 1  — root build/release file
      - "uv.lock"               # 1  — root build/release file
      - "requirements.txt"      # 1  — root build/release file

  quality-engineer:
    # Build role — default_instruction: "commit and push a dispatch branch".
    # Renamed from test-engineer (canonical registry name). May mutate tests and git history.
    allowed_tools: [Read, Write, Edit, MultiEdit, Bash, Grep, Glob]
    denied_tools: [WebSearch, WebFetch]
    bash_allow_patterns:
      - "pytest*"
      - "python3 -m pytest*"
      - "python3 -m py_compile*"
      - "git add*"
      - "git commit*"
      - "git push origin*"
    bash_deny_patterns:
      - "rm -rf*"
      - "git reset --hard*"
      - "git push --force*"
      - "git push -f*"
      - "curl*anthropic*"
    file_write_scope:
      - "tests/**"
      - "scripts/check_*"
      # --- role-scope-parity (20260815-opsch-w2-rolescope-fix): rol-te-smal own-work.
      # Test-harness / CI / review-gate infra is quality-engineer's own work per
      # the ownership map, evidenced by 4 rol-te-smal dispatches. Counts = outside
      # path-occurrences in that bucket.
      - "scripts/benchmark/**"    # 5  — benchmark runners (bench-v2-smart-lanes, oi-224)
      - "scripts/refactor_*.py"   # 2  — equivalence tooling (proof-tools-round2)
      - "scripts/lib/gate_*.py"   # 3  — review-gate infra (gate-tests-fixforward)
      - "scripts/commands/gate.sh" # 1 — review-gate infra
      - "scripts/review_gate_manager.py" # 1 — review-gate infra

  frontend-developer:
    # Build role — default_instruction: "commit and push a dispatch branch".
    # May mutate code and git history.
    allowed_tools: [Read, Write, Edit, MultiEdit, Bash, Grep, Glob]
    denied_tools: [WebSearch, WebFetch]
    bash_allow_patterns:
      - "npm*"
      - "npx*"
      - "node*"
      - "git add*"
      - "git commit*"
      - "git push origin*"
    bash_deny_patterns:
      - "rm -rf*"
      - "git push --force*"
    file_write_scope:
      - "dashboard/**"

  system-architect:
    # Build role — default_instruction: "produce the decision record and/or
    # scaffolding ... commit and push a dispatch branch". Renamed from architect
    # (canonical registry name). May write ADRs/scaffolding and git history.
    # The old architect profile denied git add/commit/push and Write/Edit, which
    # contradicted the push-mandatory dispatch footer — resolved here in favour of duty.
    allowed_tools: [Read, Write, Edit, MultiEdit, Bash, Grep, Glob]
    denied_tools: [WebSearch, WebFetch]
    bash_allow_patterns:
      - "git add*"
      - "git commit*"
      - "git push origin*"
      - "python3 -c*"
      - "python3 -m py_compile*"
      - "bash -n*"
    bash_deny_patterns:
      - "rm -rf*"
      - "git reset --hard*"
      - "git push --force*"
      - "git push -f*"
    file_write_scope:
      - "docs/governance/decisions/**"
      - "scripts/**"
      - "tests/**"

  security-engineer:
    # Build role — default_instruction: "fix it, add a regression test ... commit
    # and push a dispatch branch". The old profile denied git add/commit/push and
    # Write/Edit, contradicting the push-mandatory footer — resolved here in favour
    # of duty: a remediation worker must be able to deliver its fix.
    allowed_tools: [Read, Write, Edit, MultiEdit, Bash, Grep, Glob]
    denied_tools: [WebSearch, WebFetch]
    bash_allow_patterns:
      - "python3 -c*"
      - "python3 -m py_compile*"
      - "pytest*"
      - "git add*"
      - "git commit*"
      - "git push origin*"
      - "bash -n*"
      - "grep*"
    bash_deny_patterns:
      - "rm -rf*"
      - "git reset --hard*"
      - "git push --force*"
      - "git push -f*"
      - "curl*anthropic*"
    file_write_scope:
      - "scripts/**"
      - "tests/**"
      # --- role-scope-parity (20260815-opsch-w2-rolescope-fix): rol-te-smal own-work.
      # Permission posture / key provisioning docs are security-engineer's own work
      # per the ownership map, evidenced by 5 rol-te-smal dispatches. Narrow file
      # grants only — NOT docs/** or scripts/lib/** (scripts/** above is the
      # pre-existing remediation surface, unchanged). Counts = outside
      # path-occurrences in that bucket.
      - "docs/operations/WORKER_PERMISSIONS.md"  # 4  — permission docs
      - "docs/governance/KEY_PROVISIONING.md"     # 1  — key provisioning doc

  # Read roles — default_instruction says "Do not modify code" (code-reviewer,
  # plan-reviewer) or carries governance_profile: light (research-analyst). They
  # deny code-mutation tools and git history mutation, and are NOT dispatched
  # with the push-mandatory footer. file_write_scope is restricted to the report
  # drop so they can still deliver their findings report.
  code-reviewer:
    allowed_tools: [Read, Write, Grep, Glob, Bash]
    denied_tools: [Edit, MultiEdit, WebSearch, WebFetch]
    bash_allow_patterns:
      - "git log*"
      - "git diff*"
      - "git show*"
      - "python3 -c*"
      - "python3 -m py_compile*"
      - "bash -n*"
      - "grep*"
    bash_deny_patterns:
      - "git add*"
      - "git commit*"
      - "git push*"
      - "rm*"
    file_write_scope:
      - ".vnx-data/unified_reports/**"

  research-analyst:
    allowed_tools: [Read, Write, Grep, Glob, Bash]
    denied_tools: [Edit, MultiEdit, WebSearch, WebFetch]
    bash_allow_patterns:
      - "git log*"
      - "git diff*"
      - "git show*"
      - "python3 -c*"
      - "bash -n*"
      - "grep*"
    bash_deny_patterns:
      - "git add*"
      - "git commit*"
      - "git push*"
      - "rm*"
    file_write_scope:
      - ".vnx-data/unified_reports/**"

  plan-reviewer:
    # Read role — plan-gate panel seat (OI-1238). The panel's claude/tmux seats
    # run with --role plan-reviewer --working-tree-only: read a plan doc, ground
    # the review against the real repo (git log/diff/show, grep), write ONE
    # verdict report to the unified-reports drop. Never modifies code, never
    # dispatched with the push-mandatory footer. The role is deliberately
    # distinct from code-reviewer so govern() and the phantom-guard evaluate the
    # dispatch as a plan review, not a code review.
    allowed_tools: [Read, Write, Grep, Glob, Bash]
    denied_tools: [Edit, MultiEdit, WebSearch, WebFetch]
    bash_allow_patterns:
      - "git log*"
      - "git diff*"
      - "git show*"
      - "python3 -c*"
      - "python3 -m py_compile*"
      - "bash -n*"
      - "grep*"
    bash_deny_patterns:
      - "git add*"
      - "git commit*"
      - "git push*"
      - "rm*"
    file_write_scope:
      - ".vnx-data/unified_reports/**"

  deliberation-panelist:
    # Read role — seat role of the vnx deliberation panel (scripts/panel.py /
    # scripts/lib/deliberation_panel.py, OI-811). A panel seat runs one stage —
    # diverge, contrarian, verify, or synthesis — over a submitted question,
    # grounds its judgment in the real repo (git log/diff/show, grep), and
    # writes ONE report to the unified-reports drop. Never modifies code, never
    # dispatched with the push-mandatory footer. Not T0-dispatched: registered
    # here only because resolve_worker_profile refuses fail-closed (OI-1069
    # pt.5, #1563) on a role absent from every register, exactly like
    # plan-reviewer above. phantom_guard.REVIEW_ROLES and
    # dispatch_govern._FREEFORM_ROLES already exempt this role name by law —
    # this profile is the missing third register (OI-1359).
    allowed_tools: [Read, Write, Grep, Glob, Bash]
    denied_tools: [Edit, MultiEdit, WebSearch, WebFetch]
    bash_allow_patterns:
      - "git log*"
      - "git diff*"
      - "git show*"
      - "python3 -c*"
      - "python3 -m py_compile*"
      - "bash -n*"
      - "grep*"
    bash_deny_patterns:
      - "git add*"
      - "git commit*"
      - "git push*"
      - "rm*"
    file_write_scope:
      - ".vnx-data/unified_reports/**"

terminal_assignments:
  T1: backend-developer
  T2: quality-engineer
  T3: frontend-developer
