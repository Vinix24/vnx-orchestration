# VNX plan-gate panel composition — the seat roster the PM plan-first gate picks
# from before any implementation begins, and which seats a run uses.
#
# See scripts/lib/plan_gate_panel.py (load_panel_seats, compose_panel) for the
# loader. Every seat field mirrors the keys of the in-code roster so this file is
# a behaviour-neutral externalisation of that constant: edit this file to change
# the seats, leave it and the code falls back to the code roster.
#
# Each seat has the SAME three keys the in-code roster uses:
#   label      — the panelist identifier (stable, used by default_seat,
#                escalation_seat, --panel-seats and the per-seat verdict ledger)
#   provider   — a member of the closed Provider enum in
#                scripts/lib/dispatch_spec.py (claude, kimi, glm-harness,
#                deepseek-harness, codex, ...). An unknown value fails loud at
#                load time naming the offending seat and the valid providers.
#   model_arg  — the model string handed to the lane (opus, kimi-k3, glm-5.2,
#                ...). Not validated here; the lane rejects an unrunnable model.
#
# One seat per provider family (Anthropic / Moonshot / Zhipu / DeepSeek /
# OpenAI). A run does not use them all: see default_seat below. A seat that
# flakes (a down proxy, an uninstalled CLI, an unparseable verdict) is RETRIED
# once and then ABSTAINS as a non-scoring lane instead of vetoing — see
# apply_panel_rule's liveness quorum. Keep every provider here runnable anyway;
# the retry only rescues transient flakes. glm-harness requires the local
# litellm proxy on :4141.
#
# NOTE: gemini is intentionally omitted until the `gemini` CLI is installed —
# an unrunnable panelist emits no verdict. Adding a seat here is an operator
# decision, not a code change.

version: 1

# Panel composition (operator decision 2026-10-17, P2): ONE seat reads the plan.
# default_seat is the seat every run uses; one readable PASS from it certifies
# the gate. escalation_seat reads the same plan in the same run only when the
# default seat returns BLOCK, and the rule then decides over both verdicts. A
# REVISE does not escalate. Both must name a seat below and differ; a bad value
# fails loud. `--panel-seats` replaces the composition for one run: it runs
# exactly the seats it names, with the quorum of two for several seats, and the
# trace logs it as an override. The governance variant of the touched paths is
# still derived and recorded, but it no longer sizes the panel.
# The 17-10 measurement: codex alone landed on the panel's outcome in 35 of 36
# runs, and codex does not draw on the Claude session limit.
default_seat: codex
escalation_seat: opus

# Stop-rule (operator ladder 2026-08-15, per plan version since P2 2026-10-17).
# Rounds count per plan VERSION: every seat round's record carries the sha256 of
# the plan it read. A version without a read seat round always gets its seat
# round first, so a revised plan is never handed to the tiebreaker unread. Once
# ``max_rounds`` versions were read without a PASS, the tiebreaker decides, in
# the same run as the seat round that reached the threshold, on that latest
# version and the seat's verdict on it. A version already read below the
# threshold must change before the next run; nothing runs on it.
#
# max_rounds: the plan-version threshold. 1 is the operator decision of 17-10:
#   one seat, one round, then the tiebreaker. A malformed value fails loud.
#
# The tiebreaker model comes from the registry (ADR-036), never a Python
# literal. ``provider`` + ``model`` below name a wave7_models.yaml entry; the
# tiebreaker resolver validates the pair against the registry and fails LOUD on
# an unknown provider/model (the same fail-loud contract the static router
# uses). ``provider`` is the registry SECTION key (deepseek_harness), which the
# resolver maps to its dispatch enum (deepseek-harness) for the lane.
#
# OI-1219 (2026-08-15): the default used to be fable-5 via the anthropic
# section, which routes to the claude/tmux lane. That lane was caught three
# times on the same day delivering-without-content: a 741-token empty run
# (OI-1211), a placeholder receipt that stayed failed (OI-1202), and a
# tiebreaker timeout that governance synthesized into a body the parser then
# reported as "parse failure". deepseek-harness / deepseek-v4-pro delivered
# 100% of its dispatches that same day, so the tiebreaker now runs there.
tiebreaker:
  max_rounds: 1
  provider: deepseek_harness
  model: deepseek-v4-pro
# Minimum meaningful characters (whitespace-stripped) a track's goal_state must
# carry to stand in for the plan when `plan-gate run` is invoked WITHOUT --doc.
# The length is measured AFTER stripping whitespace, so a goal of 200 spaces is
# still refused. Read by scripts/lib/plan_gate_panel.py::load_goal_min_chars.
goal_min_chars: 200

# Coverage floor for the DELIBERATION panel's synthesis stage (OI-1154): below
# this many DELIVERED seat reports the synthesis refuses LOUDLY instead of
# silently building a report from a handful of seats (e.g. 1 of 5). The refusal
# names delivered and expected seats, and decides on the SAME present/total
# count the coverage line already shows (OI-1150) — never its own tally. The
# operator can consciously proceed below the floor with `vnx panel --allow-degraded`.
# Read by scripts/lib/plan_gate_panel.py::load_synthesis_min_seats.
# Default 3: a majority of the five-seat deliberation roster. It does not apply
# to the plan-gate, which runs one seat (default_seat above).
synthesis_min_seats: 3

seats:
  - label: opus
    provider: claude
    model_arg: opus
  - label: kimi
    provider: kimi
    model_arg: kimi-k3
  - label: glm-5.2-harness
    provider: glm-harness
    model_arg: glm-5.2
  - label: deepseek
    provider: deepseek-harness
    model_arg: deepseek-v4-pro
  - label: codex
    provider: codex
    model_arg: registry-default  # resolved to openai.default_model when the panel is built (OI-2062)
