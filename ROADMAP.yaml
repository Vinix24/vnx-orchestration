# ============================================================================
# This file is an EXAMPLE of the roadmap import format. It is not a plan source.
#
# The tracks DB is the only plan source (ADR-047). No code reads this file from
# a fixed or derived path: it is imported only when the operator names it
# explicitly, e.g.
#   python3 scripts/seed_tracks_from_roadmap.py --roadmap ROADMAP.yaml --apply
#   vnx objective sync --roadmap ROADMAP.yaml --apply
# FEATURE_PLAN.md and PR_QUEUE.md and their generators are gone (ADR-047).
#
# CI keeps the format honest: tests/test_roadmap_consistency.py checks it.
#
# Replace the example features below with your own, or import this file as-is to
# see the shape a tracks import expects.
#
# ADR-007: every new central-DB table needs a composite UNIQUE/PK over
# project_id. Cite it explicitly in review-gate prompts for schema work.
# ============================================================================

roadmap_id: vnx-roadmap
title: VNX Roadmap (example)

launch_state:
  version: "1.0.0"
  status: "example"
  last_verified: "2026-01-01"
  verified_against: "example"
  launch_blockers: []

features:
  - feature_id: example-feature
    title: "Example feature — replace with your own roadmap entries"
    risk_class: medium
    merge_policy: human
    depends_on: []
    milestone: "1.0"
    status: planned
    pr_queue: []
