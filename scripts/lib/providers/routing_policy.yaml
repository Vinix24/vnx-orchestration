# Wave 7 cost-routing policy
# Maps task-class + complexity to preferred provider lane
# Default: kimi (worker-provider-kimi-flip, 2026-07-23) — build workers (T1/T2/T3)
# default to the kimi CLI OAuth lane; Sonnet remains an explicit operator override.

version: 1
default_lane: "kimi"

# Task-class -> lane mapping
# First match wins; no match -> default_lane
rules:
  - name: simple-cleanup
    when:
      task_class: ["lint-narrow", "doc-update", "oi-closure", "rename"]
      complexity: ["low"]
    lane: "kimi"  # kimi CLI OAuth lane; flat subscription quota covers low-complexity housekeeping too
    rationale: "worker-provider-kimi-flip: low-complexity housekeeping routes to kimi like every other build-worker task; no separate haiku carve-out"

  - name: refactor-code-default
    when:
      task_class: ["refactor", "module-split", "feature-implementation"]
      complexity: ["medium", "high"]
    lane: "kimi"  # kimi CLI OAuth lane — kimi-via-cli-only constraint enforced
    rationale: "worker-provider-kimi-flip (2026-07-23): kimi is the build-worker default (proven agentic, #1210); Sonnet remains an explicit operator override, not the baseline"

  - name: review-analysis
    when:
      task_class: ["code-review", "analysis", "summarization"]
    lane: "kimi"  # kimi CLI OAuth lane — kimi-via-cli-only constraint enforced
    rationale: "Long-context review/analysis routes to the Kimi K2 CLI lane (OAuth, $0 subscription quota). litellm:moonshot is blocked by kimi-via-cli-only (provider_constraints.yaml)."

  - name: research-deep
    when:
      task_class: ["research", "design-doc", "system-architect"]
      complexity: ["high"]
    lane: "claude/opus"  # premium for deep research
    rationale: "Architect-level work warrants Opus quality"

# Fallback chain when preferred lane fails (API down, rate-limited, etc)
#
# STATUS (2026-07-09, OI-223 lane_safety loader): still ADVISORY. decide_lane()
# reads this block and resolves a chain onto RoutingDecision.fallback_chain, but
# subprocess_dispatch._select_dispatch_path deliberately discards it for non-Claude
# lanes ("This function never touches fallback_chain for non-Claude lanes") to avoid
# silently rerouting a cheap-lane dispatch back onto Claude. No caller triggers
# automatic lane switching on a failure. This is unrelated to the lane_safety block
# below — OI-223 wired lane_safety.headless_block live, NOT fallback_chain. The kimi
# entry below reflects the corrected kimi CLI lane — litellm:moonshot:* entries are
# kept for reference but litellm:moonshot routing is blocked by kimi-via-cli-only.
#
# worker-provider-kimi-flip (2026-07-23): "kimi" has NO fallback entry — a kimi-lane
# failure on a build-worker dispatch must fail loud, never silently re-route onto the
# Claude subscription. The other lanes' chains (litellm:deepseek:*, litellm:zai:*)
# still list kimi as A step in THEIR OWN fallback, which is unrelated to kimi's own
# (empty) chain.
fallback_chain:
  "litellm:deepseek:*": ["codex", "claude/sonnet-5"]
  "kimi": []
  "litellm:zai:*": ["codex", "claude/sonnet-5"]
  "claude/haiku-4-5": ["claude/sonnet-5"]
  # Sonnet and Opus have no fallback (they are the safety net)
  # kimi quota exhausted 2026-08-02 (OI-940) — codex replaces kimi as vangnet
  # for litellm:deepseek:* and litellm:zai:* chains

# Lane-safety rules.
#
# STATUS (2026-07-09, OI-223 lane_safety loader): the loader is now LIVE.
# scripts/lib/routing_policy.load_lane_safety() parses this block and
# is_claude_headless_blocked() reads `headless_block` below; both are
# consulted at scripts/lib/dispatch_bridge.py (pre-stage reject) and
# scripts/lib/dispatch_cli.py::_execute_claude_headless (the last gate
# before spawn) instead of a hardcoded env-only check. Every OTHER entry in
# this block (claude_serial_under_load, codex_retry_once, kimi_quota_fail_fast,
# tmux_spawn_max_runtime, haiku_receipt_nondeterminism) remains DECLARATIVE —
# exposed by load_lane_safety() for tooling/tests, but not read by any runtime
# gating decision. Do not rely on them as live guards.
lane_safety:
  # claude-headless-lane-block (OI-223 fold-in). OPENED 2026-08-11 (operator
  # directive, dispatch-20260811c-b): the prior block reason — "claude -p is
  # API-metered post-2026-06-15 cutover" — does not hold. Anthropic never
  # carried out that cutover, and a 2026-08-11 measurement of the auth state
  # (no ANTHROPIC_API_KEY, no ANTHROPIC_BASE_URL, keychain subscriptionType:
  # max, scope user:inference) confirms claude -p still runs on the Max
  # subscription, same as the tmux lane. Operator ratified 2026-08-04.
  #
  # USABLE, NOT GOVERNED. Opening the billing block does not close two
  # measured governance gaps (2026-08-05), both still live:
  #   1. The lane ignores isolation=worktree — the door creates a worktree,
  #      but the worker operates in the MAIN checkout and branches there, and
  #      the worktree is reaped while the real work sits uncommitted in the
  #      main repo.
  #   2. The fail-closed report gate did not bite on a report missing all
  #      four mandatory headings.
  # Treat headless as usable-but-not-yet-governed until those gaps close.
  #
  # enabled: false opens the lane by default; set enabled: true to re-block.
  # override_env is kept wired (VNX_OVERRIDE_CLAUDE_HEADLESS) so that reversal
  # stays a one-line flip — the escape hatch doesn't need to be re-added.
  headless_block:
    enabled: false
    override_env: "VNX_OVERRIDE_CLAUDE_HEADLESS"
    reason: "Opened 2026-08-11 (operator directive, dispatch-20260811c-b): claude -p runs on the Max subscription, not API credits — measured 2026-08-11 via auth state (no key/base-url, keychain subscriptionType=max). The 2026-06-15 API-metered cutover this block cited was never carried out by Anthropic. Still usable-but-not-governed: ignores isolation=worktree, and the report-gate miss from 2026-08-05 — see the comment above."

  # force_headless REMOVED (2026-08-15, OI-1174): it was dead config — never read
  # by any runtime gating decision, only asserted-present by a test. Its premise
  # (force claude-opus-4-8 / claude-sonnet-5 onto headless to dodge an
  # interactive-session hang, Issues #63390 + #64153) was empirically retracted
  # 2026-06-15 (the hang did not reproduce post-cutover) and it would fight
  # headless_block above. Headless is now reached only via the explicit
  # allow_headless=true opt-in on the DispatchSpec, so a "force these models
  # headless" knob would be a half-wired second door into the same lane. A test
  # pins its ABSENCE (tests/test_routing_policy.py::test_force_headless_removed).

  # Subscription per-prompt-complexity throttle observed under parallel claude
  # load: many sequential complex dispatches exhaust capacity mid-run. Pace
  # claude lanes serially; provider lanes (kimi/deepseek/codex) stay parallel.
  claude_serial_under_load:
    enabled: true
    reason: "Subscription complexity-throttle measured 2026-06-04 parallel=3 bench"

  # Codex lane flakiness: 2 DNFs over 8 T3 cell-attempts on 2026-06-06
  # (1 instant lane-launch failure at 0.1s, 1 mid-run rc=1 after 196s WITH a
  # report on disk). Clean cells score top-cluster (4.79-4.93), so the lane is
  # worth keeping — but a single attempt is not a verdict. Retry once before
  # scoring a codex cell or dispatch as DNF.
  #
  # 2026-08-02: codex is now the tier-low vangnet (dispatch-20260802-smart-router-
  # door-codex-fallback). When codex is invoked as a fallback — either directly
  # (no DEEPSEEK_API_KEY) or after a primary deepseek failure — this retry-once
  # rule MUST apply to prevent a single transient codex DNF from becoming a silent
  # dispatch failure. Callers of the vangnet path (tier_routing.resolve_tier_route,
  # routing_policy fallback_chain) must honour this rule.
  codex_retry_once:
    models:
      - codex-gpt-5-4
      - codex-gpt-5-5
    max_retries: 1
    reason: "Measured 2/8 DNF-rate 2026-06-06; clean-cell quality top-cluster. Extended to gpt-5.5 for vangnet (tier-low fallback, 2026-08-02)."
    review_trigger: "skill-aware re-bench 2026-06-08 DNF-rate"

  # Kimi CLI quota exhausts mid-billing-cycle (measured 2026-06-07: quota_or_auth
  # 'usage limit for this billing cycle' on first dispatch attempt). Retrying a
  # quota-exhausted lane burns wallclock for guaranteed failure. On the
  # quota_or_auth signature: skip retries entirely, go straight to the
  # fallback_chain entry for litellm:moonshot:*.
  kimi_quota_fail_fast:
    providers:
      - litellm:moonshot
    on_error_reason: "quota_or_auth"
    max_retries: 0
    reason: "Quota-exhaustion measured 2026-06-07; deterministic failure until cycle reset"

  # tmux-spawn has receipt-deadline failures on long-running workers (documented
  # lane gap, t0-orchestrator skill §9.2). Workers with an expected runtime
  # over 30 min must route via subprocess_dispatch instead.
  tmux_spawn_max_runtime:
    lane: "tmux-spawn"
    max_expected_runtime_seconds: 1800
    overflow_route: "subprocess"
    reason: "Receipt-deadline failures on >30min workers; known lane gap"

  # Haiku on trivial tasks via tmux-spawn produced receipts non-deterministically
  # (measured 2026-06: 10-worker load test, 10/10 clean teardown but 5/10
  # receipts). Receipt-critical dispatches on haiku need a receipt-presence
  # check + one redispatch, or route headless.
  haiku_receipt_nondeterminism:
    models:
      - claude-haiku-4-5
    receipt_verify: true
    max_redispatch: 1
    reason: "5/10 receipts on trivial tmux-spawn tasks, 10-worker load test"

# Provider cost reference (2026-06-06 measured, per-dispatch on T3 cells):
#   kimi-k2-6 / kimi-k2-0905 : $0       (subscription/OAuth; quota-capped per cycle)
#   claude-* (subscription)  : $0       (interactive/headless pre-2026-06-15)
#   deepseek-v4-pro-harness  : ~$0.02-0.03  (own API key)
#   codex-gpt-5-4            : ~$1.58 avg/cell over 6 T3 cells ($9.46 total),
#                              typical $0.91-1.46, p95 outlier $4.51 — budget on
#                              p95, not median ($1.25/$10 per Mtok)
# Task-pattern routing (Kimi=refactor, DeepSeek=debug, Opus=architecture) is
# DEFERRED to the skill-aware re-bench (OI-221) — current T3 data was not
# apples-to-apples on skill context. Do not encode pattern-routing until then.
