# VNX Smart Routing — Provider Constraints SSOT
#
# Single source of truth for the hard guard-rails around which provider may
# serve which role/lane. Loaded by:
#   - dispatcher pre-flight check (forbid_route / require_route)
#   - routing engine lane validation (routing_policy.yaml selection)
#   - CI grep (forbid_import patterns)
#   - audit pipeline (severity tagging on receipts)
#
# Schema (per entry under `constraints`):
#   id               kebab-case identifier, stable across versions
#   rule             forbid_route | require_route | forbid_import
#   forbidden_route  optional, used with rule=forbid_route
#                    keys: provider, model (str|list), role (str|list),
#                          task_class (str|list), via (str)
#   required_route   optional, used with rule=require_route
#                    keys: provider, model, role (str|list)
#   forbidden_import optional, used with rule=forbid_import
#                    keys: patterns (list of substrings or simple regex)
#   reason           human-readable justification (cite memory ref or ADR)
#   enforcement      code_raise | code_warn | ci_grep
#   audit_severity   blocking | warn | info
#   override_allowed bool; when true operator may bypass via env flag
#                    VNX_OVERRIDE_<UPPERCASED_ID_WITH_UNDERSCORES>=1
#   pin_semantics    floor | default; only meaningful on require_route constraints
#                    consumed as a model pin (t0-opus-only, workers-kimi-pinned).
#                    floor = coercive, spec.model is ignored, the pin always wins.
#                    default = advisory, spec.model wins when the caller set one.
#                    Missing on a present constraint reads as floor (never silently
#                    softens); an unrecognized value fails loud at load time
#                    (worker-provider-free-choice PR-1, scripts/lib/dispatch_cli.py
#                    _load_model_pins_from_yaml).

version: 1

constraints:
  - id: kimi-via-cli-only
    rule: forbid_route
    forbidden_route:
      provider: moonshot
      via: [api, moonshot]
    reason: >-
      Kimi K2/K2.6 routing in Wave 7 PR-7.7 uses the kimi CLI OAuth lane
      (`kimi login`) to avoid API-key management and rate-limit volatility.
      Direct Moonshot API routing (including litellm:moonshot sub-provider)
      competes with the CLI lane and breaks cost tracking attribution.
    enforcement: code_raise
    audit_severity: blocking
    override_allowed: false

  - id: t0-opus-only
    rule: require_route
    required_route:
      role: T0
      model: opus-5  # canonical registry key (wave7_models.yaml) — T0 runs Opus 5
    reason: >-
      T0 orchestrator performs gate evaluation across the full NDJSON ledger
      under multi-PR concurrency. Sonnet-grade reasoning regresses on missed
      gates; downgrade is only acceptable with explicit operator approval.
      Model value updated 2026-08-02 from the stale claude-opus-4-8 string to
      the canonical opus-5 registry key (model-ssot-en-ketenlink).
    enforcement: code_warn
    audit_severity: warn
    override_allowed: true
    pin_semantics: floor

  # NOTE: id intentionally retained as `workers-kimi-pinned`. The pin-loader
  # (_load_model_pins_from_yaml in scripts/lib/dispatch_cli.py) hard-keys on
  # this exact string (`elif cid == "workers-kimi-pinned"`) — renaming the id
  # drops the pin back to its default.
  - id: workers-kimi-pinned
    rule: require_route
    required_route:
      role: [T1, T2, T3]
      model: kimi-k3
    reason: >-
      Build-worker terminals (T1/T2/T3) default to kimi-k3 via the kimi CLI
      OAuth lane (operator directive 2026-07-23, worker-provider-kimi-flip-decision):
      kimi is proven agentic (--yolo + -w execute tools, #1210) and the
      subscription-flat OAuth quota keeps cost predictable. kimi-k3 default
      restored 2026-07-24 after the kimi CLI OAuth quota reset — the tactical
      sonnet flip (#1221, kimi-quota-exhausted) is superseded. Sonnet remains
      available as an explicit operator override; Opus is reserved for the T0
      orchestrator role. No automatic claude/sonnet fallback — a routing miss
      fails loud. The durable reshape (soft default, free per-dispatch provider
      choice) stays in track worker-provider-free-choice.
    enforcement: code_warn
    audit_severity: warn
    override_allowed: true
    pin_semantics: default

  - id: no-anthropic-sdk
    rule: forbid_import
    forbidden_import:
      patterns:
        - "import anthropic"
        - "from anthropic import"
        - "anthropic.Anthropic("
        - "@anthropic-ai/sdk"
    reason: >-
      VNX is a CLI-driven runtime. Importing the Anthropic SDK with OAuth
      credentials risks an Anthropic account ban (opencode/openclaw
      precedent — see feedback_avoid_claude_sdk_use_cli_oauth.md). All
      Claude work flows through the `claude` CLI via subprocess.
    enforcement: ci_grep
    audit_severity: blocking
    override_allowed: false

  - id: zai-via-openrouter-only
    rule: forbid_route
    forbidden_route:
      provider: zai
      via: direct
    reason: >-
      Native Zhipu integration is deferred. Wave 7 PR-7.3 routes GLM through
      OpenRouter; direct Zhipu API calls bypass the cost-tracking pipeline and
      the fallback chain configured in routing_policy.yaml. Only GLM-5.2 is an
      allowed version (deprecated-glm-models, operator directive 2026-08-03:
      GLM-4.5/4.6/5/5.1 blocked).
    enforcement: code_raise
    audit_severity: blocking
    override_allowed: false

  - id: deprecated-glm-models
    rule: forbid_route
    forbidden_route:
      provider: zai
      model: [glm-4.5, glm-4.6, glm-5, glm-5.1]
    reason: >-
      GLM-4.5 and GLM-4.6 are retired; base GLM-5 (Feb 2026) and GLM-5.1 are
      superseded by GLM-5.2 (released 2026-06-16). Only GLM-5.2 is allowed for
      new dispatches. Operator directive 2026-08-03: geen oudere 5-varianten.
    enforcement: code_raise
    audit_severity: blocking
    override_allowed: false

  - id: glm-via-harness-only
    rule: forbid_route
    forbidden_route:
      provider: zai
      via: [openrouter, litellm]
    reason: >-
      GLM must run via the claude-CLI harness lane (provider glm-harness → the local
      :4141 litellm proxy → OpenRouter), never the plain single-shot litellm runner
      (litellm:zai). The plain runner is far less capable (no agentic tool-use; proven
      live to echo bash instead of running it). The door normalizes litellm:zai → glm-harness
      at the bridge (dispatch_bridge alias); this constraint is the BACKSTOP for any direct
      spec that still presents the plain zai runner (via=openrouter/litellm). glm-harness
      carries the distinct via=claude_harness_openrouter, so it clears. Benchmark baselines
      that intentionally measure the plain litellm:zai runner set VNX_OVERRIDE_GLM_VIA_HARNESS_ONLY=1.
    enforcement: code_raise
    audit_severity: blocking
    override_allowed: true

  - id: deepseek-harness-subscription-blocked
    rule: forbid_route
    forbidden_route:
      provider: deepseek
      via: claude_harness_subscription
    reason: >-
      DeepSeek via Claude-harness (ANTHROPIC_BASE_URL redirect) is ALLOWED
      with own DeepSeek API-key + hardening: ANTHROPIC_BASE_URL pointing to
      DeepSeek endpoint, ANTHROPIC_API_KEY set to own DeepSeek key,
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 (+ DISABLE_TELEMETRY +
      DISABLE_AUTOUPDATER + DISABLE_ERROR_REPORTING), and MCP disabled
      (--mcp-config '{"mcpServers":{}}' --strict-mcp-config). Measured on
      claude v2.1.150 (2026-05-26): 0 calls to api.anthropic.com, all
      inference routes to the DeepSeek endpoint. BLOCKED only when routing
      through the production OAuth subscription without an own API key —
      that redirects the protected account identity to DeepSeek, which is
      the same ban-as as no-anthropic-sdk. Use via=claude_harness_keyed
      when operating with own key + hardening.
    enforcement: code_raise
    audit_severity: blocking
    override_allowed: false

  - id: claude-headless
    rule: forbid_route
    forbidden_route:
      provider: claude
      via: headless
    reason: >-
      OPENED 2026-08-11 (operator directive, dispatch-20260811c-b): the prior
      "api-metered billing" reason does not hold — claude -p runs on the Max
      subscription (measured 2026-08-11: no ANTHROPIC_API_KEY, no
      ANTHROPIC_BASE_URL, keychain subscriptionType=max, scope
      user:inference), and the 2026-06-15 API-metered cutover this constraint
      cited was never carried out by Anthropic. Operator ratified 2026-08-04.
      Downgraded from blocking to warn to match routing_policy.yaml's
      lane_safety.headless_block (both gates cover the same lane; they move
      together). USABLE, NOT YET GOVERNED: two measured gaps from 2026-08-05
      remain open regardless of billing — the lane ignores isolation=worktree
      (worktree created then reaped while the worker branches in the MAIN
      checkout, leaving real work uncommitted there) and the fail-closed
      report gate did not bite on a report missing all four mandatory
      headings. VNX_OVERRIDE_CLAUDE_HEADLESS=1 still marks an explicit
      per-dispatch opt-in for audit visibility even though the route no
      longer blocks.
    enforcement: code_warn
    audit_severity: warn
    override_allowed: true

  - id: worker-no-ambient-mcp
    rule: forbid_route
    forbidden_route:
      via: ambient_mcp
    reason: >-
      Scoped worker-mode is the fabric default since 2026-08-14
      (mcp-scoped-default): a detached worker must not inherit the operator's
      ambient MCP servers unless the dispatch explicitly declares
      requires_mcp: true. Worktree isolation bounds the FILESYSTEM, not the
      NETWORK, and an MCP server talks to a service outside the checkout —
      measured 2026-08-14: six ambient MCP servers (incl. Gmail and Google
      Drive) still connected from a dispatch worktree without opt-in. The
      binding enforcement lives in worker_permissions.build_claude_scope_args
      (empty --mcp-config unless requires_mcp=True), not in the door router;
      this entry records the decision in the SSOT. EXTENSION-BRIDGE GAP
      (2026-08-15, mcp-namespace-leak): the empty --mcp-config only reaches
      the mcpServers group, not extension bridges (claude-in-chrome) that
      surface mcp__ tools outside `claude mcp list` — measured: a scoped
      worker still loaded four mcp__claude-in-chrome__* tool schemas via
      ToolSearch. Closed by an explicit --disallowedTools mcp__* namespace
      deny (worker_permissions.MCP_NAMESPACE_DENY, verified against claude
      2.1.233), skipped under requires_mcp=True. VNX_WORKER_BLANKET_SKIP=1
      (or falsy VNX_WORKER_SCOPED) is the explicit per-dispatch opt back into
      the blanket --dangerously-skip-permissions posture.
    enforcement: code_warn
    audit_severity: warn
    override_allowed: true

  - id: worker-permission-enforcement-on
    rule: forbid_route
    forbidden_route:
      via: enforcement_skip
    reason: >-
      Worker write-boundary enforcement (worker_permissions.
      worker_permission_enforcement_enabled) defaults ON since 2026-08-15
      (operator directive, dispatch 20260815-enforce-default-on). OI-1196
      wired dispatch_paths into file_write_scope but shipped inert: the
      PreToolUse hook opens with `if not
      worker_permission_enforcement_enabled(): return "allow", None` and the
      predicate defaulted OFF, so a dispatch declaring only
      scripts/lib/smart_router.py still scored ALLOW on a write to /etc/hosts
      (measured on main). The unenforced-boundary posture (enforcement_skip)
      is therefore forbidden by default. Opt-outs: VNX_WORKER_ENFORCEMENT_SKIP=1
      (per-dispatch, same shape as VNX_WORKER_BLANKET_SKIP) or falsy
      VNX_ENFORCE_WORKER_PERMISSIONS. The binding enforcement lives in
      worker_permissions + pretooluse_worker_scope_enforce.py, not the door
      router; this entry records the decision in the SSOT. BLAST-RADIUS
      (measured pre-flip 2026-08-15, scripts/analysis/worker_scope_enforcement_measure.py):
      156 of 347 linkable dispatches would be blocked — 110 declared no
      dispatch_paths and wrote outside their role file_write_scope
      (vnx_cli/, docs/, schemas/, templates/, hooks/, configs/, bin/, .github/,
      .vnx/); of the 46 that declared paths, 43 wrote within role scope but
      outside their declared dispatch_paths and 28 wrote at least one file
      outside role scope too; plus a bare-directory fnmatch gap (23 dispatches
      declared a directory path that fnmatch does not match as a prefix).
      Operator finding to review before merge.
    enforcement: code_warn
    audit_severity: warn
    override_allowed: true
