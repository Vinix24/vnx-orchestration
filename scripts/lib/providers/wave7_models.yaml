# Wave 7 model registry — LiteLLM-compatible model names + cost/MTok
# Anthropic, OpenAI, Google entries added for cost tracking (P0-B).
providers:
  anthropic:
    enabled: true
    api_key_env: ANTHROPIC_API_KEY
    models:
      opus:
        litellm_name: "anthropic/claude-opus-4-8"
        cost_input_per_mtok: 15.00
        cost_output_per_mtok: 75.00
        max_tokens: 32000
        context_window: 200000
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding-premium", "review", "analysis"]
      opus-4-8:
        litellm_name: "anthropic/claude-opus-4-8"
        cost_input_per_mtok: 15.00
        cost_output_per_mtok: 75.00
        max_tokens: 32000
        context_window: 200000
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding-premium", "review", "analysis"]
      opus-4-6:
        # RETIRED alias, kept deliberately (2026-07-22 model-registry-refresh): the field-test
        # benchmark harness (scripts/benchmark/) pins this exact retired snapshot for historical
        # reproducibility (see scripts/benchmark/models.yaml comment "pin 4-6 explicitly").
        # NOT used by current routing — smart_router / routing_recommendations.yaml use
        # `opus`/`opus-4-8` (current) instead. Do not repurpose this key for current traffic.
        litellm_name: "anthropic/claude-opus-4-6"
        cost_input_per_mtok: 15.00
        cost_output_per_mtok: 75.00
        max_tokens: 32000
        context_window: 200000
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding-premium", "review", "analysis"]
      sonnet:
        litellm_name: "anthropic/claude-sonnet-5"
        cost_input_per_mtok: 3.00
        cost_output_per_mtok: 15.00
        max_tokens: 64000
        context_window: 200000
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding", "review", "analysis"]
      haiku:
        litellm_name: "anthropic/claude-haiku-4-5-20251001"
        cost_input_per_mtok: 1.00
        cost_output_per_mtok: 5.00
        max_tokens: 8096
        context_window: 200000
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding", "fast"]
      # 5-series (dispatch-20260802-model-ssot-en-ketenlink): Sonnet 5, Opus 5 and
      # Fable 5 now run in the fleet (operator + T0 run Opus 5; Fable 5 is the top
      # rung of the climb) but were absent from the registry. Model ids + prices
      # verified 2026-08-02 against the Anthropic first-party catalog: Sonnet 5
      # $3/$15 per MTok, Opus 5 $5/$25, Fable 5 $10/$50. Context/max-output are the
      # API ceilings (1M context / 128K output).
      sonnet-5:
        litellm_name: "anthropic/claude-sonnet-5"
        cost_input_per_mtok: 3.00
        cost_output_per_mtok: 15.00
        max_tokens: 128000
        context_window: 1000000
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding", "review", "analysis"]
      opus-5:
        litellm_name: "anthropic/claude-opus-5"
        cost_input_per_mtok: 5.00
        cost_output_per_mtok: 25.00
        max_tokens: 128000
        context_window: 1000000
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding-premium", "review", "analysis"]
      fable-5:
        litellm_name: "anthropic/claude-fable-5"
        cost_input_per_mtok: 10.00
        cost_output_per_mtok: 50.00
        max_tokens: 128000
        context_window: 1000000
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding-premium", "review", "analysis"]
  openai:
    enabled: true
    api_key_env: OPENAI_API_KEY
    models:
      gpt-5.5:
        litellm_name: "openai/gpt-5.5"
        cost_input_per_mtok: 1.25
        cost_output_per_mtok: 10.00
        max_tokens: 32000
        context_window: 128000
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding", "review"]
      gpt-5.4:
        litellm_name: "openai/gpt-5.4"
        cost_input_per_mtok: 1.25
        cost_output_per_mtok: 10.00
        max_tokens: 32000
        context_window: 128000
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding", "review"]
  google:
    enabled: true
    api_key_env: GEMINI_API_KEY
    models:
      gemini-2.5-pro:
        litellm_name: "google/gemini-2.5-pro"
        cost_input_per_mtok: 1.25
        cost_output_per_mtok: 5.00
        max_tokens: 65536
        context_window: 1048576
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding", "review", "analysis"]
  deepseek:
    enabled: true
    api_key_env: DEEPSEEK_API_KEY
    # OI-867: this is the litellm-proxy (:4141) route — DISABLED for dispatch
    # because the proxy does not carry a valid DEEPSEEK_API_KEY.  The working
    # DeepSeek route is deepseek_harness (below), which uses the Claude Code
    # harness with its own API key (no proxy).  The m:n relationship note:
    #   litellm:deepseek    -> proxy :4141 -> DeepSeek  = DISABLED (no key)
    #   deepseek-harness    -> claude_harness_keyed     = WORKS (own key)
    #   glm-harness/zai     -> proxy :4141 -> OpenRouter = WORKS (has key)
    models:
      deepseek-v4-pro:
        litellm_name: "deepseek/deepseek-v4-pro"
        cost_input_per_mtok: 0.435   # currently 75% discount; full $1.74 input
        cost_output_per_mtok: 0.87   # full $3.48 output
        max_tokens: 384000           # 384K output ceiling
        context_window: 1000000      # 1M context
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding-premium", "review", "analysis"]
        dispatch_allowed: false  # OI-867: litellm proxy has no DEEPSEEK_API_KEY
      deepseek-v4-flash:
        litellm_name: "deepseek/deepseek-v4-flash"
        cost_input_per_mtok: 0.14    # legacy "chat" model evolved
        cost_output_per_mtok: 0.28
        max_tokens: 384000
        context_window: 1000000
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding", "review", "analysis"]
        dispatch_allowed: false  # OI-867: litellm proxy has no DEEPSEEK_API_KEY
  deepseek_harness:
    enabled: true
    api_key_env: DEEPSEEK_API_KEY
    # OI-867: the working DeepSeek route — claude_harness_keyed, uses its own
    # API key via the Anthropic-compatible DeepSeek endpoint.  No proxy.
    models:
      deepseek-v4-pro:
        litellm_name: ""
        cli_model_arg: "deepseek-v4-pro"
        cost_input_per_mtok: 0.435
        cost_output_per_mtok: 0.87
        max_tokens: 384000
        context_window: 1000000
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding-premium", "review", "analysis"]
        dispatch_allowed: true
      deepseek-v4-flash:
        litellm_name: ""
        cli_model_arg: "deepseek-v4-flash"
        cost_input_per_mtok: 0.14
        cost_output_per_mtok: 0.28
        max_tokens: 384000
        context_window: 1000000
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding", "review", "analysis"]
        dispatch_allowed: true
      deepseek-v4-pro-default:
        litellm_name: ""
        cli_model_arg: "deepseek-v4-pro"
        cost_input_per_mtok: 0.435
        cost_output_per_mtok: 0.87
        max_tokens: 384000
        context_window: 1000000
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding-premium", "review", "analysis"]
        dispatch_allowed: true
  moonshot:
    enabled: true
    api_key_env: MOONSHOT_API_KEY
    models:
      kimi-k2-0905-default:
        litellm_name: "moonshot/kimi-k2-0905-preview"
        cost_input_per_mtok: 0.60
        cost_output_per_mtok: 2.50
        max_tokens: 8192
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding", "review", "analysis"]
        dispatch_allowed: false  # bare-baseline only; governed dispatch uses kimi_cli
      kimi-k2-6:
        litellm_name: "moonshot/kimi-k2.6"
        cost_input_per_mtok: 0.95
        cost_output_per_mtok: 4.00
        max_tokens: 8192
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding-premium"]
        dispatch_allowed: false  # bare-baseline only; governed dispatch uses kimi_cli
  zai:
    enabled: true
    api_key_env: OPENROUTER_API_KEY  # via OpenRouter, not direct Zhipu
    direct_provider_note: "Native Zhipu integration deferred; PR-7.3 uses OpenRouter fallback"
    models:
      glm-5.2:
        litellm_name: "openrouter/z-ai/glm-5.2"  # GLM-5.2 (released 2026-06-16)
        cost_input_per_mtok: 0.60
        cost_output_per_mtok: 1.92
        max_tokens: 8192
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding", "review"]
        deprecated_models:
          - "glm-4.5"
          - "glm-4.6"
          - "glm-5"
          - "glm-5.1"
  local_gemma:
    enabled: true
    api_key_env: ""  # no API key; runs entirely on-device via MLX or Ollama
    models:
      gemma-4b-local:
        litellm_name: ""  # local only; not via LiteLLM
        cost_input_per_mtok: 0.0
        cost_output_per_mtok: 0.0
        max_tokens: 8192
        context_window: 8192
        supports_streaming: false
        supports_tool_calls: false
        task_classes: ["simple_synthesis", "classification", "documentation", "translation"]
        runtime: mlx
        fallback_runtime: ollama
        fallback_model: "gemma3:4b"
        cost_tier: 0   # local inference, zero API cost
        capability_score:
          simple_synthesis: 0.85
          classification: 0.80
          complex_reasoning: 0.40
          code_edit: 0.50
  kimi_cli:
    enabled: true
    api_key_env: ""  # no API key; OAuth via `kimi login`
    # WS1 (20260721-kimi-lane-hardening): explicit default, independent of YAML key
    # order — _resolve_kimi_model_label() reads this flag rather than "first dict key".
    default_model: kimi-k3
    models:
      kimi-k3:
        litellm_name: ""  # kimi CLI direct; not via LiteLLM
        # Verified 20260721 against the installed kimi-cli 1.46.0's own ~/.kimi/config.toml
        # (models."kimi-code/k3", 1M context, display_name "K3") — not guessed.
        cli_model_arg: "kimi-code/k3"
        cost_input_per_mtok: 0.60
        cost_output_per_mtok: 2.50
        max_tokens: 8192
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding", "coding-premium", "review", "analysis"]
        dispatch_allowed: true
      kimi-k2-7:
        litellm_name: ""  # kimi CLI direct; not via LiteLLM
        # Verified 20260721 against ~/.kimi/config.toml (models."kimi-code/kimi-for-coding",
        # display_name "K2.7 Coding"; this is the CLI's OWN config default_model).
        cli_model_arg: "kimi-code/kimi-for-coding"
        cost_input_per_mtok: 0.60
        cost_output_per_mtok: 2.50
        max_tokens: 8192
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding", "review", "analysis"]
        dispatch_allowed: true
      kimi-default:
        litellm_name: ""  # kimi CLI direct; not via LiteLLM
        cost_input_per_mtok: 0.60   # estimate based on moonshot K2 pricing
        cost_output_per_mtok: 2.50
        max_tokens: 8192
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding", "review", "analysis"]
        dispatch_allowed: true
      kimi-k2-6:
        litellm_name: ""  # kimi CLI direct; not via LiteLLM
        cost_input_per_mtok: 0.95
        cost_output_per_mtok: 4.00
        max_tokens: 8192
        supports_streaming: true
        supports_tool_calls: true
        task_classes: ["coding-premium"]
        # DISABLED 20260721 (kimi-lane-hardening): kimi-cli 1.46.0 has no "kimi-k2.6"/K2.6
        # model (verified against the installed CLI's own config.toml — only kimi-code/k3,
        # kimi-code/kimi-for-coding, and kimi-code/kimi-for-coding-highspeed exist; K2.6 was
        # apparently retired/renamed upstream to K2.7). The old dot-form cli_model_arg was
        # stale and unverifiable in this env, so it is cleared (not kept) rather than passed
        # through — disabled here so the pre-flight registry check rejects it instead of a
        # worker silently receiving a dead `-m` string.
        dispatch_allowed: false
