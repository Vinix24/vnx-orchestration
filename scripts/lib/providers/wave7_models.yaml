# Wave 7 model registry — LiteLLM-compatible model names + cost/MTok
# Anthropic, OpenAI, Google entries added for cost tracking (P0-B).
providers:
  anthropic:
    enabled: true
    api_key_env: ANTHROPIC_API_KEY
    # dispatch_enum: the dispatch Provider enum value (dispatch_spec.Provider)
    # this section routes to. ADR-036: provider identity is read from this
    # registry, never hard-coded in Python on the routing path.
    dispatch_enum: claude
    models:
      opus:
        litellm_name: "anthropic/claude-opus-4-8"
        cost_input_per_mtok: 15.00
        cost_output_per_mtok: 75.00
        max_tokens: 32000
        context_window: 200000
        supports_streaming: true
        supports_tool_calls: true
        price_source: "unverified: registry-authored"
        price_checked_at: "2026-05-17"
        task_classes: ["coding-premium", "review", "analysis"]
