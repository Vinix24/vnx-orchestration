# Golf B, B1: canonical branch-protection configuration for `main`.
#
# Applied via `python3 scripts/forge/apply_branch_protection.py` (the first
# apply is an operator step — see that script's docstring). Drift-checked by
# `scripts/pr_merge.py`'s merge preflight and by `vnx doctor`
# (`check_branch_protection_drift` in scripts/vnx_doctor.py). Measured live
# via `gh api repos/{owner}/{repo}/branches/main/protection` (+
# `.../required_signatures`, `repos/{owner}/{repo}`, `.../rulesets`) on
# 2026-09-07 — see the dispatch report for the exact commands and output.
#
# Do not hand-edit the checks[] list without also updating the workflow that
# produces the matching context name in .github/workflows/ — this file and
# the workflow must describe the same context names, or CI and branch
# protection silently diverge (see scripts/lib/ci_contexts.py's docstring
# for what that divergence looks like in practice: PR #1691).
#
# The one deliberate exception is vnx-gate/*: those contexts are produced by
# the `vnx-gate` GitHub App, not by any workflow in this checkout. Do NOT add
# a workflow for them. The cost of the exception is a readability one, and it
# is known: ci_contexts cannot tell "not yet published" from "no producer
# exists" for such a context, so a head without a published verdict reads as
# SKIPPED_UNVERIFIED rather than as "run the publisher". Blocking is correct,
# the wording points the wrong way — see FORGE_GATE.md §5.
branch: main

required_status_checks:
  strict: false
  checks:
    - {context: "Profile A (doctor + core tests)", app_id: 15368}
    - {context: "Profile B (snapshot integration)", app_id: 15368}
    - {context: "Profile C (adoption smoke tests)", app_id: 15368}
    - {context: "Profile D (pip install smoke)", app_id: 15368}
    - {context: "ADR-003: No Anthropic SDK Imports", app_id: 15368}
    - {context: "Anchor Immutability Check", app_id: 15368}
    - {context: "Dashboard TS Lint (fixture-gate + typecheck)", app_id: 15368}
    - {context: "Dispatch-ID Slug-Match Gate", app_id: 15368}
    - {context: "docs/core/SUBSYSTEMS.md matches the live registry", app_id: 15368}
    - {context: "Lint Patterns (silent-except + atomic-write)", app_id: 15368}
    - {context: "Repo-local state-pin gate (#1043 footgun)", app_id: 15368}
    - {context: "Trace Token Validation", app_id: 15368}
    - {context: "secret scan (gitleaks)", app_id: 15368}
    - {context: "vnx doctor smoke", app_id: 15368}
    # De samenvattende check van B3 — vereist sinds OP-B3, niet langer
    # geparkeerd. Hij zegt per head of er een geldig review-akkoord ligt,
    # volgens dezelfde regel als de merge-deur
    # (closure_verifier._REVIEW_PEER_GATES + check_review_gate_for_merge).
    # Publiceren, per PR-head:
    #
    #   python3 scripts/lib/forge_gate_publisher.py review --pr <n>
    #
    # Anders dan bij een pending_checks-entry staat het app_id hier WEL als
    # tweede kopie van `app.app_id` onderaan dit bestand, en dat is geen
    # inconsistentie maar het verschil tussen de twee lijsten. pending_checks
    # gaat nooit de deur uit: de proefdraai bindt zo'n entry op leestijd aan
    # `app.app_id`, dus een tweede kopie daar was overbodig en vrij om af te
    # wijken van het getal dat tekent. checks[] IS het PUT-object, en GitHub
    # eist de binding per entry — zonder app_id in de entry zelf zou elke app
    # deze status mogen zetten. Vandaar dat de schemalezer een vnx-gate/*-entry
    # zonder gebonden app_id hier weigert (null of de "elke app"-sentinel -1).
    # Blijf dit getal dus gelijkhouden aan `app.app_id`: dat is de identiteit
    # die forge_check_run.py ondertekent, en dus de enige App die deze check
    # kan vervullen.
    #
    # Terugweg (branch-breed, met verplichte reden): FORGE_GATE.md §7.
    - {context: "vnx-gate/review", app_id: 4869217}

# Leeg sinds OP-B3. Het slot zelf blijft bestaan: een entry hier is een
# toekomstige verplichting en geen huidige eis — apply_branch_protection.py
# laat hem uit het PUT-object en forge_protection_drift.py vergelijkt hem niet.
# Het PUT-object dat een promotie uit deze lijst zou opleveren lees je vooraf
# met:
#
#   python3 scripts/lib/forge_gate_publisher.py pending-preview
pending_checks: []

required_pull_request_reviews:
  required_approving_review_count: 0
  dismiss_stale_reviews: false
  require_code_owner_reviews: false
  require_last_push_approval: false

enforce_admins: true
required_signatures: false
required_linear_history: false
allow_force_pushes: false
allow_deletions: false
allow_fork_syncing: false
block_creations: false
lock_branch: false
required_conversation_resolution: false

# GitHub omits this key entirely from a GET when there is no restriction
# object; the PUT endpoint requires it as an explicit `null` to mean "no
# push restrictions". Kept as a required field (not optional) so a future
# editor cannot drop it silently — apply_branch_protection.py never writes
# anything else here.
restrictions: null

repo:
  allow_auto_merge: false

# Checked, never applied — apply_branch_protection.py never writes rulesets.
# GET /repos/{owner}/{repo}/rulesets returned [] when this was measured.
rulesets: []

# WIE publiceert, niet wat main vereist.
#
# De publieke helft van de identiteit van de review-poort-App, gelezen door
# `scripts/lib/forge_check_run.py::load_app_config` om het App-JWT te
# ondertekenen. Het legt main geen enkele eis op: apply_branch_protection.py
# laat dit blok uit het PUT-object en forge_protection_drift.py vergelijkt het
# niet, dus een wijziging hier kan nooit als drift of als verzwakking lezen.
# De vereiste-check zelf komt in B3 in required_status_checks hierboven, met
# dit app_id eraan gebonden.
#
# App geregistreerd op 2026-09-08 (checks: write + metadata: read, alleen op
# Vinix24/vnx-orchestration). De sleutel en het installation-id staan in de
# keychain onder vnx-gate-app-key en vnx-gate-installation-id — zie
# docs/operations/FORGE_GATE.md.
app:
  slug: vnx-gate
  app_id: 4869217
